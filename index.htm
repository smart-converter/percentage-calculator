<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO Percentage Calculator</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); line-height: 1.4; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* Компактна шапка */
        .header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; gap: 10px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: -0.5px; flex: 1; }
        
        /* Зменшуємо "повітря" у виборі мов */
        .lang-select { 
            background: #334155; 
            color: white; 
            border: 2px solid var(--accent); 
            padding: 5px 10px; /* Мінімальні відступи */
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 16px; /* Оптимальний розмір */
            outline: none;
            height: 36px; /* Фіксована висота для компактності */
            appearance: none; /* Прибираємо системні стрілки де можливо */
            -webkit-appearance: none;
        }

        .container { max-width: 800px; margin: 10px auto; padding: 0 15px; box-sizing: border-box; }
        .calc-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .calc-card h3 { margin: 0 0 15px 0; font-size: 20px; color: var(--accent); font-weight: 800; }
        
        .calc-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .input-group { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
        
        .input-box { width: 100px; padding: 12px; border: 2px solid #475569; border-radius: 12px; font-size: 18px; font-weight: 800; background: #0f172a; color: white; outline: none; box-sizing: border-box; }
        .res-box { min-width: 120px; padding: 12px; border: 2px solid var(--success); border-radius: 12px; font-size: 20px; font-weight: 900; background: rgba(34, 197, 94, 0.1); color: var(--success); text-align: center; }
        
        .seo-text { padding: 25px; font-size: 15px; color: #cbd5e1; background: var(--card-bg); border-radius: 20px; margin-top: 20px; border: 1px solid #334155; }
        footer { text-align: center; padding: 40px 20px; background: #0f172a; border-top: 1px solid #334155; margin-top: 30px; }
        .footer-link { color: var(--accent); cursor: pointer; text-decoration: none; margin: 0 10px; font-weight: 700; font-size: 14px; }

        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card-bg); margin: 30px auto; padding: 30px; width: 85%; max-width: 600px; border-radius: 20px; border: 1px solid var(--accent); position: relative; max-height: 80vh; overflow-y: auto; }
        .close { position: absolute; right: 15px; top: 5px; font-size: 35px; cursor: pointer; color: #64748b; }

        @media (max-width: 600px) {
            .calc-row { flex-direction: column; align-items: stretch; }
            .input-box, .res-box { width: 100%; }
        }
    </style>
</head>
<body>
