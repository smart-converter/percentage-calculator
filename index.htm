<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator Pro - Fast & Accurate Online Tool</title>
    <meta name="description" content="Free professional percentage calculator. Calculate basic percentages, difference, and increase or decrease instantly and accurately.">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Smart Percentage Calculator",
      "url": "https://smart-converter.github.io/percentage-calculator/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: #334155;
            --border-glow: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-light); 
            -webkit-font-smoothing: antialiased; font-display: swap; 
        }
        
        /* HEADER - FIXED HEIGHT FOR CLS */
        .top-header { background-color: #166534; height: 56px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); box-sizing: border-box; }
        .top-header h1 { margin: 0; font-size: 18px; font-weight: 900; color: white; letter-spacing: 0.5px; }
        
        .lang-switcher { background: var(--bg-dark); border: 1.5px solid white; color: white; padding: 4px 6px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 700; outline: none; }
        .lang-switcher option { color: #333; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        
        /* TABS - EXACTLY LIKE UNIT CONVERTER */
        .tabs-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; 
            background-color: #14532d; border: 1px solid #14532d; 
            margin: 10px 0; border-radius: 8px; overflow: hidden; height: 44px;
        }
        .tab { 
            background: #166534; color: #fff; border: none; cursor: pointer; 
            font-size: 11px; font-weight: 800; text-transform: uppercase; 
            display: flex; align-items: center; justify-content: center; height: 100%; transition: 0.2s;
        }
        .tab.active { background: #fff; color: #166534; }
        
        .ad-space { 
            background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--border-color); 
            margin: 10px 0; text-align: center; color: var(--text-muted); 
            font-size: 10px; height: 90px; display: flex; align-items: center; justify-content: center; border-radius: 8px; 
        }
        
        .converter-box { border: 1px solid var(--border-color); padding: 25px 20px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .row { display: flex; align-items: center; margin-bottom: 15px; }
        .row label { width: 120px; font-size: 14px; color: var(--text-muted); font-weight: 600; }
        .input-field { 
            flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; 
            font-size: 18px; font-weight: 800; background: #fff; color: #000; outline: none; width: 100%; box-sizing: border-box; 
        }
        .res-field { background: #f0fdf4 !important; color: #166534 !important; border: 2px solid #22c55e !important; }

        /* SEO CONTENT - CLEAN & READABLE */
        .seo-content { padding: 20px 5px; line-height: 1.6; font-size: 14px; color: var(--text-muted); }
        .seo-content h2 { color: var(--accent-green); font-size: 18px; margin: 20px 0 10px; font-weight: 800; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }

        /* TOOLS NETWORK - IDENTICAL TO UNIT CONVERTER */
        .tools-network { padding: 20px 0; text-align: center; border-top: 1px solid var(--border-color); }
        .tools-network h4 { margin: 0 0 15px 0; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 400px; margin: 0 auto; }
        .tool-link-btn { 
            padding: 10px 5px; border: 1px solid var(--accent-green); color: var(--accent-green); 
            text-decoration: none; border-radius: 8px; font-size: 11px; font-weight: 800; 
            display: flex; align-items: center; justify-content: center; min-height: 40px; box-sizing: border-box;
        }
        .tool-link-btn:last-child:nth-child(odd) { grid-column: 1 / span 2; width: calc(50% - 4px); justify-self: center; }

        /* FOOTER - COMPACT & CENTERED */
        footer { border-top: 1px solid var(--border-color); padding: 30px 15px; text-align: center; font-size: 12px; color: var(--text-muted); }
        .footer-info-block { 
            border: 1px solid var(--border-glow); border-radius: 12px; padding: 15px; 
            margin: 0 auto 20px auto; background: rgba(255, 255, 255, 0.02); 
            text-align: left; max-width: 500px; line-height: 1.5; font-size: 13px;
        }
        .footer-link { color: var(--accent-green); text-decoration: none; cursor: pointer; padding: 5px 10px; font-weight: 700; display: inline-block; }
        
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 25px; width: 85%; max-width: 500px; border-radius: 15px; position: relative; border: 1px solid var(--border-color); color: white; }
        .close-btn { position: absolute; right: 15px; top: 5px; font-size: 32px; cursor: pointer; }
    </style>
</head>
<body>

<header class="top-header">
    <h1>SmartPercentage.io</h1>
    <select class="lang-switcher" onchange="changeLang(this.value)" id="langSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
    </select>
</header>

<main class="container">
    <div id="tabs" class="tabs-grid"></div>
    <div class="ad-space">ADVERTISEMENT</div>
    
    <section class="converter-box">
        <div id="calc-ui"></div>
        <div class="row" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <label id="lbl-result" for="valOut">Result:</label>
            <input type="text" id="valOut" class="input-field res-field" readonly>
        </div>
    </section>

    <div class="seo-content" id="seo-box"></div>

    <div class="tools-network">
        <h4 id="txt-other-tools">Other Elite Tools</h4>
        <div class="tools-grid">
            <a href="https://smart-converter.github.io/unit-converter/" class="tool-link-btn">Unit Converter</a>
            <a href="https://smart-converter.github.io/currency-converter/" class="tool-link-btn">Currency</a>
            <a href="https://smart-converter.github.io/vat-calculator/" class="tool-link-btn">VAT Calc</a>
            <a href="https://smart-converter.github.io/loan-calculator/" class="tool-link-btn">Loans</a>
            <a href="https://smart-converter.github.io/discount-calculator/" class="tool-link-btn">Discounts</a>
            <a href="https://smart-converter.github.io/tip-calculator/" class="tool-link-btn">Tips</a>
            <a href="https://smart-converter.github.io/bmi-calculator/" class="tool-link-btn">BMI Calc</a>
        </div>
    </div>
</main>

<footer>
    <div class="footer-info-block" id="footer-full-text"></div>
    <p>© 2026 SmartPercentage.io - Precise Financial Tools</p>
    <div>
        <span class="footer-link" onclick="openPol('privacy')" id="link-privacy">Privacy</span>
        <span class="footer-link" onclick="openPol('terms')" id="link-terms">Terms</span>
    </div>
</footer>

<div id="siteModal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content"><span class="close-btn" onclick="closeModal()">×</span><div id="modalBody"></div></div>
</div>

<script>
    const translations = {
        en: {
            res: "Result:", other: "Other Elite Tools", cats: ["Basic %", "Difference", "Increase"],
            l1: "Percentage %", l2: "Of Number", l3: "Initial Value", l4: "Final Value", l5: "Value",
            footer: "SmartPercentage.io is your go-to destination for high-precision percentage calculations. We use advanced algorithms to ensure 100% accuracy for business and students.",
            seo: `<h2>Why Use Our Calculator?</h2><p>Our tool supports three main modes: finding a percentage of a number, calculating differences, and adding increases.</p>`,
            privacy: "Privacy Policy", terms: "Terms of Use",
            privText: "<h2>Privacy</h2><p>We do not store any data. Calculations are local.</p>",
            termsText: "<h2>Terms</h2><p>For informational purposes only.</p>"
        },
        uk: {
            res: "Результат:", other: "Інші професійні інструменти", cats: ["Базовий %", "Різниця", "Приріст"],
            l1: "Відсоток %", l2: "Від числа", l3: "Початкове", l4: "Кінцеве", l5: "Значення",
            footer: "SmartPercentage.io — це ваш надійний помічник для високоточних розрахунків відсотків. Ми використовуємо сучасні алгоритми для 100% точності.",
            seo: `<h2>Навіщо потрібен наш калькулятор?</h2><p>Наш інструмент підтримує три основні режими: знаходження відсотка, розрахунок різниці та приросту.</p>`,
            privacy: "Конфіденційність", terms: "Умови",
            privText: "<h2>Конфіденційність</h2><p>Ми не зберігаємо дані. Розрахунки локальні.</p>",
            termsText: "<h2>Умови</h2><p>Тільки для інформаційних цілей.</p>"
        }
    };

    let curLang = localStorage.getItem('lang_perc') || 'en';
    let currentTab = 0;

    function changeLang(lang) { 
        curLang = lang; 
        localStorage.setItem('lang_perc', lang); 
        updateUI(); 
    }

    function updateUI() {
        const l = translations[curLang] || translations.en;
        document.getElementById('langSelect').value = curLang;
        document.getElementById('lbl-result').innerText = l.res;
        document.getElementById('txt-other-tools').innerText = l.other;
        document.getElementById('footer-full-text').innerText = l.footer;
        document.getElementById('link-privacy').innerText = l.privacy;
        document.getElementById('link-terms').innerText = l.terms;
        document.getElementById('seo-box').innerHTML = l.seo;
        initTabs();
    }

    function initTabs() {
        const t = document.getElementById('tabs'); t.innerHTML = '';
        const l = translations[curLang] || translations.en;
        l.cats.forEach((cat, i) => {
            const b = document.createElement('button');
            b.className = `tab ${i === currentTab ? 'active' : ''}`;
            b.innerText = cat;
            b.onclick = () => { currentTab = i; initTabs(); renderCalc(); };
            t.appendChild(b);
        });
        renderCalc();
    }

    function renderCalc() {
        const l = translations[curLang] || translations.en;
        const container = document.getElementById('calc-ui');
        let html = '';
        if (currentTab === 0) {
            html = `<div class="row"><label>${l.l1}:</label><input type="number" id="v1" class="input-field" value="10" oninput="calc()"></div>
                    <div class="row"><label>${l.l2}:</label><input type="number" id="v2" class="input-field" value="100" oninput="calc()"></div>`;
        } else if (currentTab === 1) {
            html = `<div class="row"><label>${l.l3}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label>${l.l4}:</label><input type="number" id="v2" class="input-field" value="125" oninput="calc()"></div>`;
        } else {
            html = `<div class="row"><label>${l.l5}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label>${l.l1} (+):</label><input type="number" id="v2" class="input-field" value="20" oninput="calc()"></div>`;
        }
        container.innerHTML = html;
        calc();
    }

    function calc() {
        const a = parseFloat(document.getElementById('v1').value) || 0;
        const b = parseFloat(document.getElementById('v2').value) || 0;
        const out = document.getElementById('valOut');
        let res = 0;
        if (currentTab === 0) res = a * (b / 100);
        else if (currentTab === 1) res = a !== 0 ? ((b - a) / a) * 100 : 0;
        else res = a + (a * (b / 100));
        out.value = currentTab === 1 ? res.toFixed(2) + "%" : res.toLocaleString(undefined, {maximumFractionDigits: 2});
    }

    function openPol(type) {
        const l = translations[curLang] || translations.en;
        document.getElementById('modalBody').innerHTML = type === 'privacy' ? l.privText : l.termsText;
        document.getElementById('siteModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('siteModal').style.display = 'none'; }

    updateUI();
</script>
</body>
</html>
