<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator - Professional Dark Edition</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); line-height: 1.6; }
        
        .header { background: #1e293b; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h1 { margin: 0; font-size: 30px; font-weight: 900; color: var(--accent); letter-spacing: -1px; text-transform: uppercase; }
        
        .lang-select { background: #334155; color: white; border: 1px solid var(--accent); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        
        .calc-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; padding: 25px; margin-bottom: 15px; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .calc-card:hover { border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        
        /* Більші заголовки */
        .calc-card h3 { margin: 0 0 20px 0; font-size: 22px; color: var(--text); font-weight: 800; border-left: 4px solid var(--accent); padding-left: 15px; }
        
        .calc-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .input-group { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; }
        
        .input-box { width: 110px; padding: 12px; border: 2px solid #475569; border-radius: 10px; font-size: 20px; font-weight: 800; background: #0f172a; color: white; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3); }
        
        .res-box { min-width: 120px; padding: 12px; border: 2px solid var(--success); border-radius: 10px; font-size: 22px; font-weight: 900; background: rgba(34, 197, 94, 0.1); color: var(--success); text-align: center; }
        
        .ad-space { background: rgba(255,255,255,0.03); border: 1px dashed #475569; padding: 20px; text-align: center; margin: 20px 0; font-size: 12px; color: #94a3b8; border-radius: 12px; }
        
        .seo-text { padding: 30px; font-size: 16px; color: #cbd5e1; background: var(--card-bg); border-radius: 16px; margin-top: 30px; border: 1px solid #334155; }
        .seo-text h2 { color: var(--accent); font-size: 24px; font-weight: 900; }
        
        footer { text-align: center; padding: 50px 20px; background: #0f172a; border-top: 1px solid #334155; color: #94a3b8; }
        .footer-link { color: var(--accent); cursor: pointer; text-decoration: none; margin: 0 15px; font-weight: 800; }
        .footer-link:hover { text-decoration: underline; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 40px auto; padding: 40px; width: 90%; max-width: 700px; border-radius: 20px; border: 1px solid var(--accent); color: #e2e8f0; }
        .close { position: absolute; right: 25px; top: 15px; font-size: 40px; cursor: pointer; color: #64748b; }

        @media (max-width: 600px) { .calc-row { flex-direction: column; align-items: stretch; } .input-box { width: 100%; } }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">Percentage Calc</h1>
    <select class="lang-select" onchange="setLang(this.value)" id="langPicker">
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
    </select>
</div>

<div class="container">
    <div class="ad-space">ADVERTISEMENT</div>

    <div class="calc-card">
        <h3 id="h3-t1">Find Percentage</h3>
        <div class="calc-row">
            <div class="input-group"><span id="t1-1">What is</span> <input type="number" id="t1-p" class="input-box" oninput="calc1()"> <span id="t1-2">% of</span></div>
            <div class="input-group"><input type="number" id="t1-v" class="input-box" oninput="calc1()"> <span>=</span></div>
            <input type="text" id="t1-res" class="res-box" readonly>
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t2">Ratio Analysis</h3>
        <div class="calc-row">
            <div class="input-group"><input type="number" id="t2-v1" class="input-box" oninput="calc2()"> <span id="t2-1">is what % of</span></div>
            <div class="input-group"><input type="number" id="t2-v2" class="input-box" oninput="calc2()"> <span>=</span></div>
            <input type="text" id="t2-res" class="res-box" readonly>
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t3">Price Change</h3>
        <div class="calc-row">
            <div class="input-group"><span id="t3-1">From</span> <input type="number" id="t3-v1" class="input-box" oninput="calc3()"> <span id="t3-2">to</span></div>
            <div class="input-group"><input type="number" id="t3-v2" class="input-box" oninput="calc3()"> <span id="t3-3">is:</span></div>
            <input type="text" id="t3-res" class="res-box" readonly>
        </div>
    </div>

    <div class="seo-text" id="seo-content"></div>
</div>

<footer>
    <p id="footer-copy">© 2025 PercentageCalculator.io - Premium Tool</p>
    <div style="margin-top:20px;">
        <span class="footer-link" onclick="openModal('privacy')" id="link-priv">Privacy Policy</span>
        <span class="footer-link" onclick="openModal('terms')" id="link-terms">Terms of Use</span>
    </div>
</footer>

<div id="modal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
const data = {
    en: {
        title: "Pro % Calc",
        h1: "Find Percentage Value", h2: "Number Ratio to %", h3: "Percentage Change Rate",
        t1_1: "What is", t1_2: "% of", t2_1: "is what % of", t3_1: "From", t3_2: "to", t3_3: "result:",
        seo: `<h2>Advanced Percentage Solutions</h2><p>Our professional <strong>Percentage Calculator</strong> is optimized for business and personal finance. Calculate sales tax, investment ROI, and discounts with high-speed algorithms.</p><h2>How It Works</h2><p>We provide three modes: finding a specific portion, determining the ratio between two figures, and calculating growth or decline rates.</p>`,
        privText: `<h2>Privacy Policy</h2><p>This Privacy Policy explains how we manage data. At PercentageCalculator.io, we prioritize your anonymity. We do not collect personal identifiers like names, emails, or phone numbers. Our website uses industry-standard HTTPS encryption to ensure a secure connection.</p><p>We use third-party services like Google AdSense to serve advertisements. These services may use cookies to show ads based on your interests. By using our site, you consent to this data processing for a better user experience.</p>`,
        termsText: `<h2>Terms of Service</h2><p>Welcome to PercentageCalculator.io. By accessing this website, you agree to comply with our Terms of Use. All calculations and tools provided here are for informational purposes only. We strive for 100% accuracy, but we are not legally responsible for any financial losses or errors resulting from the use of our calculators.</p><p>Users are prohibited from using automated scripts or scrapers to extract data or code from this website. The intellectual property of the tool belongs to the site owners.</p>`
    },
    uk: {
        title: "PRO % Калькулятор",
        h1: "Розрахунок % від числа", h2: "Відсоткове співвідношення", h3: "Динаміка зміни (різниця)",
        t1_1: "Скільки буде", t1_2: "% від", t2_1: "це який % від", t3_1: "З", t3_2: "до", t3_3: "зміна:",
        seo: `<h2>Професійний розрахунок відсотків</h2><p>Наш інструмент створений для тих, кому потрібна швидкість і точність. Рахуйте ПДВ, маржу або знижки за лічені секунди.</p><h2>Функціонал</h2><p>Використовуйте три основні модулі: знаходження частини, частка від цілого та розрахунок зростання/падіння ціни.</p>`,
        privText: `<h2>Політика конфіденційності</h2><p>Ваша конфіденційність є нашим пріоритетом. Цей сайт не збирає особисту інформацію, таку як імена або адреси електронної пошти. Ми використовуємо файли cookie через сервіс Google AdSense для показу персоналізованої реклами.</p><p>Всі дані про ваше перебування на сайті обробляються анонімно. Використовуючи наш ресурс, ви погоджуєтеся на використання кукі-файлів для покращення роботи сервісу.</p>`,
        termsText: `<h2>Умови використання</h2><p>Користуючись PercentageCalculator.io, ви погоджуєтеся з наступними умовами. Весь контент та обчислювальні алгоритми надаються виключно для ознайомлювальних цілей. Ми не несемо відповідальності за будь-які фінансові наслідки або помилки в розрахунках.</p><p>Заборонено використовувати автоматизовані системи (боти, скрипти) для копіювання коду або масового збору даних з цього сайту. Ми залишаємо за собою право оновлювати алгоритми без попередження.</p>`
    },
    es: {
        title: "Calculadora PRO",
        h1: "Calcular Porcentaje", h2: "Relación de Números", h3: "Tasa de Cambio",
        t1_1: "Cuánto es el", t1_2: "% de", t2_1: "es qué % de", t3_1: "De", t3_2: "a", t3_3: "es:",
        seo: `<h2>Calculadora de Porcentajes Elite</h2><p>Optimice sus cálculos financieros con nuestra herramienta de alta precisión. Ideal para negocios y estudiantes.</p>`,
        privText: `<h2>Política de Privacidad</h2><p>En PercentageCalculator.io, respetamos su privacidad. No recopilamos información personal identificable. Utilizamos cookies de terceros, como Google AdSense, para mostrar anuncios relevantes basados en sus visitas anteriores.</p><p>Su navegación es segura gracias al cifrado HTTPS. Al utilizar nuestro sitio, usted acepta el uso de estas tecnologías para mejorar la calidad del servicio publicitario y funcional.</p>`,
        termsText: `<h2>Términos de Servicio</h2><p>Al acceder a este sitio web, usted acepta cumplir con estos Términos de Uso. Los resultados proporcionados por nuestras herramientas son solo para fines informativos. No nos hacemos responsables de pérdidas financieras o errores derivados del uso de nuestra calculadora.</p><p>Está prohibido el uso de herramientas automáticas para extraer contenido o código de este sitio. Nos reservamos el derecho de modificar estos términos en cualquier momento para mejorar la experiencia del usuario.</p>`
    },
    de: {
        title: "Prozentrechner PRO",
        h1: "Prozentwert berechnen", h2: "Prozentuales Verhältnis", h3: "Preisänderung (%)",
        t1_1: "Was sind", t1_2: "% von", t2_1: "ist wie viel % von", t3_1: "Von", t3_2: "auf", t3_3: "ist:",
        seo: `<h2>Premium Prozentrechner Online</h2><p>Präzise Ergebnisse für Business und Alltag. Berechnen Sie Steuern und Rabatte sofort.</p>`,
        privText: `<h2>Datenschutzrichtlinie</h2><p>Der Schutz Ihrer Daten ist uns wichtig. PercentageCalculator.io sammelt keine personenbezogenen Daten wie Namen oder E-Mail-Adressen. Wir verwenden Google AdSense Cookies, um Anzeigen basierend auf Ihren Interessen zu schalten.</p><p>Ihre Verbindung zu unserer Website ist durch HTTPS verschlüsselt. Mit der Nutzung unserer Website erklären Sie sich mit der Verwendung von Cookies einverstanden, um die Benutzererfahrung zu optimieren.</p>`,
        termsText: `<h2>Nutzungsbedingungen</h2><p>Durch die Nutzung dieser Website erklären Sie sich mit unseren Bedingungen einverstanden. Alle Berechnungen dienen nur zu Informationszwecken. Wir übernehmen keine Haftung für finanzielle Entscheidungen oder Rechenfehler, die durch die Nutzung dieses Tools entstehen.</p><p>Die Verwendung von automatisierten Skripten zum Auslesen von Daten oder Code von dieser Website ist strengstens untersagt. Wir behalten uns das Recht vor, die Algorithmen jederzeit anzupassen.</p>`
    }
};

let cur = localStorage.getItem('lang_calc_dark') || 'en';

function setLang(lang) {
    cur = lang;
    localStorage.setItem('lang_calc_dark', lang);
    const l = data[lang];
    document.getElementById('main-title').innerText = l.title;
    document.getElementById('h3-t1').innerText = l.h1;
    document.getElementById('h3-t2').innerText = l.h2;
    document.getElementById('h3-t3').innerText = l.h3;
    document.getElementById('t1-1').innerText = l.t1_1;
    document.getElementById('t1-2').innerText = l.t1_2;
    document.getElementById('t2-1').innerText = l.t2_1;
    document.getElementById('t3-1').innerText = l.t3_1;
    document.getElementById('t3-2').innerText = l.t3_2;
    document.getElementById('t3-3').innerText = l.t3_3;
    document.getElementById('footer-copy').innerText = l.title + " - © 2025";
    document.getElementById('link-priv').innerText = (lang==='uk'?'Конфіденційність':lang==='es'?'Privacidad':lang==='de'?'Datenschutz':'Privacy Policy');
    document.getElementById('link-terms').innerText = (lang==='uk'?'Умови':lang==='es'?'Términos':lang==='de'?'Bedingungen':'Terms of Use');
    document.getElementById('seo-content').innerHTML = l.seo;
    document.getElementById('langPicker').value = lang;
}

function calc1() {
    const p = parseFloat(document.getElementById('t1-p').value), v = parseFloat(document.getElementById('t1-v').value);
    const res = document.getElementById('t1-res');
    if(!isNaN(p) && !isNaN(v)) res.value = ((p / 100) * v).toFixed(2); else res.value = "";
}

function calc2() {
    const v1 = parseFloat(document.getElementById('t2-v1').value), v2 = parseFloat(document.getElementById('t2-v2').value);
    const res = document.getElementById('t2-res');
    if(!isNaN(v1) && !isNaN(v2) && v2 !== 0) res.value = ((v1 / v2) * 100).toFixed(2) + "%"; else res.value = "";
}

function calc3() {
    const v1 = parseFloat(document.getElementById('t3-v1').value), v2 = parseFloat(document.getElementById('t3-v2').value);
    const res = document.getElementById('t3-res');
    if(!isNaN(v1) && !isNaN(v2) && v1 !== 0) {
        const diff = ((v2 - v1) / v1) * 100;
        res.value = (diff > 0 ? "+" : "") + diff.toFixed(2) + "%";
        res.style.color = diff >= 0 ? "#22c55e" : "#ef4444";
    } else res.value = "";
}

function openModal(type) {
    const l = data[cur];
    document.getElementById('modal-body').innerHTML = type === 'privacy' ? l.privText : l.termsText;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
setLang(cur);
</script>
</body>
</html>
