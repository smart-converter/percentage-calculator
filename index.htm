<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator Pro - Fast & Accurate Online Tool</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: #334155;
            --border-glow: rgba(255, 255, 255, 0.2);
        }

        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-light); -webkit-font-smoothing: antialiased; }
        
        .top-header { background-color: #166534; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .top-header h1 { margin: 0; font-size: 20px; font-weight: 900; color: white; }
        .lang-switcher { background: var(--bg-dark); border: 2px solid white; color: white; padding: 4px 8px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 800; }
        .lang-switcher option { color: #333; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 5px; box-sizing: border-box; min-height: 100vh; }
        
        .tabs-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; 
            background-color: #14532d; border: 1px solid #14532d; 
            margin: 15px 0 10px; border-radius: 8px; overflow: hidden;
            min-height: 44px; 
        }
        .tab { background: #166534; color: #fff; height: 44px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; justify-content: center; border: none; }
        .tab.active { background: #fff; color: #166534; }
        
        .ad-space { 
            background: rgba(255, 255, 255, 0.05); border: 1px dashed var(--border-color); 
            margin: 10px 0; text-align: center; padding: 15px; color: var(--text-muted); 
            font-size: 11px; min-height: 90px; height: 90px; display: flex; align-items: center; justify-content: center; border-radius: 8px; 
        }
        
        .converter-box { border: 1px solid var(--border-color); padding: 30px 20px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .row { display: flex; align-items: center; margin-bottom: 18px; }
        .row label { width: 140px; font-size: 16px; color: var(--text-muted); font-weight: 700; }
        .input-field { flex: 1; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 19px; font-weight: 800; background: #fff; color: #000; outline: none; width: 100%; box-sizing: border-box; }
        .res-field { background: #f0fdf4 !important; color: #166534 !important; border-color: #22c55e !important; }

        .seo-content { padding: 15px; line-height: 1.7; font-size: 15px; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 20px; }
        .seo-content h2 { color: var(--accent-green); font-size: 19px; margin: 20px 0 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; font-weight: 900; }

        .tools-network { padding: 20px 15px; text-align: center; border-top: 1px solid var(--border-color); margin-top: 20px; }
        .tools-network h4 { margin: 0 0 15px 0; color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tool-link-btn { padding: 12px 5px; border: 1px solid var(--accent-green); color: var(--accent-green); text-decoration: none; border-radius: 8px; font-size: 12px; font-weight: 900; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .tool-link-btn:last-child:nth-child(odd) { grid-column: 1 / span 2; justify-self: center; width: calc(50% - 5px); }

        footer { border-top: 1px solid var(--border-color); padding: 25px 15px; text-align: center; font-size: 13px; color: var(--text-muted); }
        .footer-info-block { border: 2px solid var(--border-glow); border-radius: 12px; padding: 18px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.05); text-align: left; }
        .footer-link { color: var(--accent-green); text-decoration: underline; cursor: pointer; padding: 0 8px; font-weight: 900; }
        
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 5% auto; padding: 25px; width: 90%; max-width: 600px; border-radius: 12px; position: relative; border: 2px solid var(--border-glow); color: white; line-height: 1.6; }
        .close-btn { position: absolute; right: 10px; top: 0; font-size: 38px; cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

<div class="top-header">
    <h1>SmartPercentage.io</h1>
    <select class="lang-switcher" onchange="changeLang(this.value)" id="langSelect" aria-label="Change language">
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
    </select>
</div>

<div class="container">
    <div id="tabs" class="tabs-grid"></div>
    <div class="ad-space">ADVERTISEMENT AREA</div>
    
    <div class="converter-box">
        <div id="calc-ui"></div>
        <div class="row" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <label id="lbl-result" for="valOut">Result:</label>
            <input type="text" id="valOut" class="input-field res-field" readonly aria-label="Result">
        </div>
    </div>

    <div class="seo-content" id="seo-box"></div>

    <div class="tools-network">
        <h4 id="txt-other-tools">Other Elite Tools</h4>
        <div class="tools-grid">
            <a href="https://smart-converter.github.io/unit-converter/" class="tool-link-btn" id="lnk-unit">Unit Converter</a>
            <a href="https://smart-converter.github.io/currency-converter/" class="tool-link-btn" id="lnk-cur">Currency Converter</a>
            <a href="https://smart-converter.github.io/vat-calculator/" class="tool-link-btn" id="lnk-vat">VAT Calculator</a>
            <a href="https://smart-converter.github.io/loan-calculator/" class="tool-link-btn" id="lnk-loan">Loan Calculator</a>
            <a href="https://smart-converter.github.io/discount-calculator/" class="tool-link-btn" id="lnk-disc">Discount Calc</a>
            <a href="https://smart-converter.github.io/tip-calculator/" class="tool-link-btn" id="lnk-tip">Tip Calculator</a>
            <a href="https://smart-converter.github.io/bmi-calculator/" class="tool-link-btn" id="lnk-bmi">BMI Calculator</a>
        </div>
    </div>
</div>

<footer>
    <div class="footer-info-block" id="footer-full-text"></div>
    <p>© 2026 SmartPercentage.io - Precise Financial Tools</p>
    <div>
        <span class="footer-link" onclick="openPol('privacy')" id="link-privacy">Privacy Policy</span>
        <span class="footer-link" onclick="openPol('terms')" id="link-terms">Terms of Use</span>
    </div>
</footer>

<div id="siteModal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content"><span class="close-btn" onclick="closeModal()">×</span><div id="modalBody"></div></div>
</div>

<script>
    const translations = {
        en: {
            res: "Result:", other: "Other Elite Tools", cats: ["Basic %", "Difference", "Increase"],
            l1: "Percentage %", l2: "Of Number", l3: "Initial Value", l4: "Final Value", l5: "Value",
            unit: "Unit Converter", cur: "Currency Converter", vat: "VAT Calculator", loan: "Loan Calculator", disc: "Discount Calc", tip: "Tip Calculator", bmi: "BMI Calculator",
            footer: "SmartPercentage.io is your go-to destination for high-precision percentage calculations. Whether you are a business professional calculating profit margins or a student working on math problems, our tool provides instant, reliable results. We use advanced algorithms to ensure that every calculation, from simple percentages to complex growth increases, is 100% accurate and mathematically sound.",
            seo: `<h2>Why Use Our Percentage Calculator?</h2><p>In finance, shopping, and data analysis, percentages are everywhere. <strong>SmartPercentage.io</strong> simplifies these tasks. Our tool supports three main modes: finding a percentage of a number, calculating the percentage difference between two values, and adding a percentage increase to a base value.</p><h2>Perfect for Business and Daily Life</h2><p>Need to calculate a 15% tip? Or a 20% increase in annual revenue? Our professional interface is optimized for both mobile and desktop, ensuring you get the answers you need in seconds.</p>`,
            privacy: "Privacy Policy", terms: "Terms of Use",
            privText: "<h2>Privacy Policy</h2><p>Your privacy is our priority. SmartPercentage.io does not store any numerical data you enter. All calculations are performed instantly in your browser.</p>",
            termsText: "<h2>Terms of Use</h2><p>Our tools are provided for informational purposes. While we strive for absolute mathematical precision, we recommend verifying critical financial figures with official banking documents.</p>"
        },
        uk: {
            res: "Результат:", other: "Інші професійні інструменти", cats: ["Базовий %", "Різниця", "Приріст"],
            l1: "Відсоток %", l2: "Від числа", l3: "Початкове", l4: "Кінцеве", l5: "Значення",
            unit: "Конвертер", cur: "Курси валют", vat: "ПДВ", loan: "Кредити", disc: "Знижки", tip: "Чайові", bmi: "Індекс маси",
            footer: "SmartPercentage.io — це ваш надійний помічник для високоточних розрахунків відсотків. Незалежно від того, чи ви професійний фінансист, чи студент, наш інструмент забезпечує миттєві та надійні результати. Ми використовуємо сучасні алгоритми, щоб гарантувати 100% точність кожного обчислення: від простих часток до складних відсоткових різниць та приростів.",
            seo: `<h2>Навіщо потрібен наш калькулятор відсотків?</h2><p>У фінансах, покупках та аналізі даних відсотки зустрічаються скрізь. <strong>SmartPercentage.io</strong> спрощує ці завдання. Наш інструмент підтримує три основні режими: знаходження відсотка від числа, розрахунок відсоткової різниці між двома значеннями та додавання відсоткового приросту.</p><h2>Ідеально для бізнесу та побуту</h2><p>Потрібно порахувати 15% чайових? Або 20% приросту річного доходу? Наш інтерфейс оптимізований для мобільних пристроїв та десктопів, щоб ви отримували відповіді за секунди.</p>`,
            privacy: "Конфіденційність", terms: "Умови",
            privText: "<h2>Політика конфіденційності</h2><p>Ваша конфіденційність — наш пріоритет. Ми не зберігаємо ваші дані. Усі розрахунки відбуваються прямо у вашому браузері.</p>",
            termsText: "<h2>Умови використання</h2><p>Інструменти надаються для інформаційних цілей. Ми рекомендуємо перевіряти критичні фінансові дані в офіційних джерелах.</p>"
        },
        es: {
            res: "Resultado:", other: "Otras herramientas", cats: ["Básico %", "Diferencia", "Aumento"],
            l1: "Porcentaje %", l2: "Del número", l3: "Valor inicial", l4: "Valor final", l5: "Valor",
            unit: "Convertidor", cur: "Moneda", vat: "IVA", loan: "Préstamos", disc: "Descuento", tip: "Propina", bmi: "IMC",
            footer: "SmartPercentage.io es su destino preferido para cálculos de porcentaje de alta precisión. Ya sea un profesional de negocios que calcula márgenes de beneficio o un estudiante, nuestra herramienta ofrece resultados instantáneos. Actualizamos nuestros algoritmos matemáticos regularmente para garantizar que cada cálculo de crecimiento sea 100% preciso.",
            seo: `<h2>¿Por qué utilizar nuestra calculadora de porcentajes?</h2><p>En las finanzas, las compras y el análisis de datos, los porcentajes están en todas partes. <strong>SmartPercentage.io</strong> simplifica estas tareas. Nuestra herramienta admite tres modos: encontrar el porcentaje de un número, calcular la diferencia y añadir aumentos.</p><h2>Perfecto para el uso diario</h2><p>Calcula propinas, descuentos comerciales o crecimientos anuales en segundos con nuestra interfaz optimizada para móviles.</p>`,
            privacy: "Privacidad", terms: "Términos",
            privText: "<h2>Política de Privacidad</h2><p>Su privacidad es nuestra prioridad. No almacenamos datos. Los cálculos se realizan localmente en su navegador.</p>",
            termsText: "<h2>Términos de Uso</h2><p>Nuestras herramientas se proporcionan solo con fines informativos. Verifique los datos financieros críticos.</p>"
        },
        de: {
            res: "Ergebnis:", other: "Andere Werkzeuge", cats: ["Basis %", "Differenz", "Zunahme"],
            l1: "Prozent %", l2: "Von Zahl", l3: "Initialwert", l4: "Endwert", l5: "Wert",
            unit: "Konverter", cur: "Währung", vat: "MwSt", loan: "Kredit", disc: "Rabatt", tip: "Trinkgeld", bmi: "BMI",
            footer: "SmartPercentage.io ist Ihre Anlaufstelle für hochpräzise Prozentrechnungen. Ob Sie als Geschäftsmann Gewinnmargen berechnen oder als Student an Matheaufgaben arbeiten, unser Tool liefert sofortige Ergebnisse. Wir verwenden fortschrittliche Algorithmen, um sicherzustellen, dass jede Berechnung zu 100% mathematisch korrekt ist.",
            seo: `<h2>Warum unseren Prozentrechner nutzen?</h2><p>In Finanzen und Datenanalysen sind Prozentsätze allgegenwärtig. <strong>SmartPercentage.io</strong> vereinfacht diese Aufgaben. Unser Tool unterstützt die Berechnung von Anteilen, Differenzen und prozentualen Steigerungen.</p><h2>Ideal für Business und Alltag</h2><p>Berechnen Sie Trinkgelder, Rabatte oder Umsatzsteigerungen in Sekunden mit unserem professionellen Interface.</p>`,
            privacy: "Datenschutz", terms: "AGB",
            privText: "<h2>Datenschutzrichtlinie</h2><p>Ihre Privatsphäre ist uns wichtig. Wir speichern keine Daten. Alle Berechnungen erfolgen lokal in Ihrem Browser.</p>",
            termsText: "<h2>Nutzungsbedingungen</h2><p>Unsere Tools dienen nur zu Informationszwecken. Bitte überprüfen Sie wichtige Finanzdaten offiziell.</p>"
        }
    };

    let curLang = localStorage.getItem('lang_perc') || 'en';
    let currentTab = 0;

    function changeLang(lang) { 
        curLang = lang; 
        localStorage.setItem('lang_perc', lang); 
        updateUI(); 
    }

    function updateUI() {
        const l = translations[curLang] || translations.en;
        document.getElementById('langSelect').value = curLang;
        document.getElementById('lbl-result').innerText = l.res;
        document.getElementById('txt-other-tools').innerText = l.other;
        document.getElementById('footer-full-text').innerText = l.footer;
        document.getElementById('link-privacy').innerText = l.privacy;
        document.getElementById('link-terms').innerText = l.terms;
        document.getElementById('seo-box').innerHTML = l.seo;
        
        document.getElementById('lnk-unit').innerText = l.unit;
        document.getElementById('lnk-cur').innerText = l.cur;
        document.getElementById('lnk-vat').innerText = l.vat;
        document.getElementById('lnk-loan').innerText = l.loan;
        document.getElementById('lnk-disc').innerText = l.disc;
        document.getElementById('lnk-tip').innerText = l.tip;
        document.getElementById('lnk-bmi').innerText = l.bmi;
        
        initTabs();
    }

    function initTabs() {
        const t = document.getElementById('tabs'); t.innerHTML = '';
        const l = translations[curLang] || translations.en;
        l.cats.forEach((cat, i) => {
            const d = document.createElement('div');
            d.className = `tab ${i === currentTab ? 'active' : ''}`;
            d.innerText = cat;
            d.onclick = () => { currentTab = i; initTabs(); renderCalc(); };
            t.appendChild(d);
        });
        renderCalc();
    }

    function renderCalc() {
        const l = translations[curLang] || translations.en;
        const container = document.getElementById('calc-ui');
        let html = '';
        if (currentTab === 0) {
            html = `<div class="row"><label for="v1">${l.l1}:</label><input type="number" id="v1" class="input-field" value="10" oninput="calc()" aria-label="Percent"></div>
                    <div class="row"><label for="v2">${l.l2}:</label><input type="number" id="v2" class="input-field" value="100" oninput="calc()" aria-label="Value"></div>`;
        } else if (currentTab === 1) {
            html = `<div class="row"><label for="v1">${l.l3}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()" aria-label="Initial Value"></div>
                    <div class="row"><label for="v2">${l.l4}:</label><input type="number" id="v2" class="input-field" value="125" oninput="calc()" aria-label="Final Value"></div>`;
        } else {
            html = `<div class="row"><label for="v1">${l.l5}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()" aria-label="Base Value"></div>
                    <div class="row"><label for="v2">${l.l1} (+):</label><input type="number" id="v2" class="input-field" value="20" oninput="calc()" aria-label="Percent to add"></div>`;
        }
        container.innerHTML = html;
        calc();
    }

    function calc() {
        const a = parseFloat(document.getElementById('v1').value) || 0;
        const b = parseFloat(document.getElementById('v2').value) || 0;
        const out = document.getElementById('valOut');
        let res = 0;
        if (currentTab === 0) res = a * (b / 100);
        else if (currentTab === 1) res = a !== 0 ? ((b - a) / a) * 100 : 0;
        else res = a + (a * (b / 100));
        
        out.value = currentTab === 1 ? res.toFixed(2) + "%" : res.toLocaleString(undefined, {maximumFractionDigits: 2});
    }

    function openPol(type) {
        const l = translations[curLang] || translations.en;
        document.getElementById('modalBody').innerHTML = type === 'privacy' ? l.privText : l.termsText;
        document.getElementById('siteModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('siteModal').style.display = 'none'; }

    updateUI();
</script>
</body>
</html>
