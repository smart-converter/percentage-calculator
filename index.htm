<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO Percentage Calculator</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        .header { background: #1e293b; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; flex-wrap: wrap; gap: 15px; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: -1px; }
        
        /* Виправлене віконце вибору мов */
        .lang-select { background: #334155; color: white; border: 2px solid var(--accent); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: 900; font-size: 17px; outline: none; line-height: 1; }

        .container { max-width: 850px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; }
        
        .calc-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: transform 0.3s ease; }
        .calc-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        
        .calc-card h3 { margin: 0 0 20px 0; font-size: 24px; color: var(--text); font-weight: 900; border-left: 5px solid var(--accent); padding-left: 15px; }
        
        .calc-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .input-group { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; }
        
        .input-box { width: 115px; padding: 14px; border: 2px solid #475569; border-radius: 12px; font-size: 20px; font-weight: 800; background: #0f172a; color: white; outline: none; }
        .input-box:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        
        .res-box { min-width: 130px; padding: 14px; border: 2px solid var(--success); border-radius: 12px; font-size: 22px; font-weight: 900; background: rgba(34, 197, 94, 0.15); color: var(--success); text-align: center; }
        
        .ad-space { background: rgba(255,255,255,0.03); border: 1px dashed #475569; padding: 20px; text-align: center; margin: 25px 0; font-size: 12px; color: #64748b; border-radius: 15px; text-transform: uppercase; }
        
        .seo-text { padding: 35px; font-size: 16px; color: #cbd5e1; background: var(--card-bg); border-radius: 20px; margin-top: 30px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .seo-text h2 { color: var(--accent); font-size: 26px; font-weight: 900; margin-top: 0; }
        
        footer { text-align: center; padding: 60px 20px; background: #0f172a; border-top: 1px solid #334155; margin-top: 40px; }
        .footer-link { color: var(--accent); cursor: pointer; text-decoration: none; margin: 0 15px; font-weight: 800; font-size: 17px; }

        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 40px auto; padding: 40px; width: 90%; max-width: 750px; border-radius: 25px; border: 2px solid var(--accent); position: relative; color: #e2e8f0; line-height: 1.8; }
        .close { position: absolute; right: 25px; top: 10px; font-size: 50px; cursor: pointer; color: #64748b; font-weight: 200; }

        @media (max-width: 650px) {
            .calc-row { flex-direction: column; align-items: stretch; }
            .input-box, .res-box { width: 100%; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">PRO Percentage</h1>
    <select class="lang-select" onchange="setLang(this.value)" id="langPicker">
        <option value="en">ENGLISH</option>
        <option value="uk">УКРАЇНСЬКА</option>
        <option value="es">ESPAÑOL</option>
        <option value="de">DEUTSCH</option>
    </select>
</div>

<div class="container">
    <div class="ad-space">Google AdSense Space</div>

    <div class="calc-card">
        <h3 id="h3-t1">Find Percentage</h3>
        <div class="calc-row">
            <div class="input-group"><span id="t1-1">What is</span> <input type="number" id="t1-p" class="input-box" oninput="calc1()" placeholder="%"> <span id="t1-2">% of</span></div>
            <div class="input-group"><input type="number" id="t1-v" class="input-box" oninput="calc1()" placeholder="Val"> <span>=</span></div>
            <input type="text" id="t1-res" class="res-box" readonly>
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t2">Ratio Analysis</h3>
        <div class="calc-row">
            <div class="input-group"><input type="number" id="t2-v1" class="input-box" oninput="calc2()"> <span id="t2-1">is what % of</span></div>
            <div class="input-group"><input type="number" id="t2-v2" class="input-box" oninput="calc2()"> <span>=</span></div>
            <input type="text" id="t2-res" class="res-box" readonly>
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t3">Price Change</h3>
        <div class="calc-row">
            <div class="input-group"><span id="t3-1">From</span> <input type="number" id="t3-v1" class="input-box" oninput="calc3()"> <span id="t3-2">to</span></div>
            <div class="input-group"><input type="number" id="t3-v2" class="input-box" oninput="calc3()"> <span id="t3-3">is:</span></div>
            <input type="text" id="t3-res" class="res-box" readonly>
        </div>
    </div>

    <div class="seo-text" id="seo-content"></div>
</div>

<footer>
    <p id="footer-copy">© 2025 PRO Percentage</p>
    <div style="margin-top:25px;">
        <span class="footer-link" onclick="openModal('privacy')" id="link-priv">Privacy Policy</span>
        <span class="footer-link" onclick="openModal('terms')" id="link-terms">Terms of Use</span>
    </div>
</footer>

<div id="modal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
const data = {
    en: {
        title: "PRO % Calc",
        h1: "Find Percentage Value", h2: "Number Ratio to %", h3: "Percentage Change Rate",
        t1_1: "What is", t1_2: "% of", t2_1: "is what % of", t3_1: "From", t3_2: "to", t3_3: "result:",
        seo: `<h2>Advanced Percentage Solutions</h2><p>Our professional <strong>Percentage Calculator</strong> is optimized for business and personal finance. Calculate sales tax, investment ROI, and discounts with high-speed algorithms.</p><h2>Accuracy in Every Calculation</h2><p>Used by students and financial analysts worldwide, this tool ensures your calculations are 100% correct every time.</p>`,
        privText: `<h2>Privacy Policy</h2><p>At PercentageCalculator.io, we prioritize your anonymity. We do not collect personal identifiers like names, emails, or phone numbers. Our website uses industry-standard HTTPS encryption to ensure a secure connection.</p><p>We use third-party services like Google AdSense to serve advertisements. These services may use cookies to show ads based on your interests. By using our site, you consent to this data processing for a better user experience.</p>`,
        termsText: `<h2>Terms of Service</h2><p>Welcome to PercentageCalculator.io. By accessing this website, you agree to comply with our Terms of Use. All calculations provided here are for informational purposes only. We are not responsible for any financial losses resulting from the use of our calculators.</p><p>Users are prohibited from using automated scripts to extract data. The intellectual property belongs to the site owners.</p>`
    },
    uk: {
        title: "PRO % Калькулятор",
        h1: "Розрахунок % від числа", h2: "Відсоткове співвідношення", h3: "Динаміка зміни (різниця)",
        t1_1: "Скільки буде", t1_2: "% від", t2_1: "це який % від", t3_1: "З", t3_2: "до", t3_3: "зміна:",
        seo: `<h2>Професійний розрахунок відсотків</h2><p>Наш інструмент створений для тих, кому потрібна швидкість і точність. Рахуйте ПДВ, маржу або знижки за лічені секунди.</p><h2>Чому обирають нас?</h2><p>Ми забезпечуємо миттєві результати та підтримуємо три найпопулярніші режими розрахунків для навчання та бізнесу.</p>`,
        privText: `<h2>Політика конфіденційності</h2><p>Ваша конфіденційність є нашим пріоритетом. Цей сайт не збирає особисту інформацію, таку як імена або адреси електронної пошти. Ми використовуємо файли cookie через сервіс Google AdSense для показу персоналізованої реклами.</p><p>Всі дані про ваше перебування на сайті обробляються анонімно. Використовуючи наш ресурс, ви погоджуєтеся на використання кукі-файлів для покращення роботи сервісу.</p>`,
        termsText: `<h2>Умови використання</h2><p>Користуючись PercentageCalculator.io, ви погоджуєтеся з наступними умовами. Весь контент та обчислювальні алгоритми надаються виключно для ознайомлювальних цілей. Ми не несемо відповідальності за будь-які фінансові наслідки або помилки в розрахунках.</p><p>Заборонено використовувати автоматизовані системи (боти, скрипти) для копіювання коду або збору даних з цього сайту.</p>`
    },
    es: {
        title: "PRO Porcentaje",
        h1: "Calcular Porcentaje", h2: "Relación de Números", h3: "Tasa de Cambio",
        t1_1: "Cuánto es el", t1_2: "% de", t2_1: "es qué % de", t3_1: "De", t3_2: "a", t3_3: "es:",
        seo: `<h2>Calculadora de Porcentajes Elite</h2><p>Optimice sus cálculos financieros con nuestra herramienta de alta precisión. Ideal para negocios y estudiantes.</p><h2>Resultados Instantáneos</h2><p>Nuestra plataforma está diseñada para ofrecer rapidez y exactitud en cálculos de impuestos, márgenes y descuentos comerciales.</p>`,
        privText: `<h2>Política de Privacidad</h2><p>En PercentageCalculator.io, respetamos su privacidad. No recopilamos información personal identificable. Utilizamos cookies de terceros, como Google AdSense, para mostrar anuncios relevantes basados en sus intereses.</p><p>Su navegación es segura gracias al cifrado HTTPS. Al utilizar nuestro sitio, usted acepta el uso de estas tecnologías para mejorar la calidad del servicio publicitario.</p>`,
        termsText: `<h2>Términos de Uso</h2><p>Al acceder a este sitio web, usted acepta cumplir con estos Términos de Uso. Los resultados proporcionados son solo para fines informativos. No nos hacemos responsables de pérdidas financieras derivadas del uso de nuestra calculadora.</p><p>Está prohibido el uso de herramientas automáticas para extraer contenido o código de este sitio sin autorización previa.</p>`
    },
    de: {
        title: "Prozentrechner PRO",
        h1: "Prozentwert berechnen", h2: "Prozentuales Verhältnis", h3: "Preisänderung (%)",
        t1_1: "Was sind", t1_2: "% von", t2_1: "ist wie viel % von", t3_1: "Von", t3_2: "auf", t3_3: "ist:",
        seo: `<h2>Premium Prozentrechner Online</h2><p>Präzise Ergebnisse für Business und Alltag. Berechnen Sie Steuern, Rabatte und Zinsen sofort.</p><h2>Ihre Vorteile</h2><p>Ein schnelles, zuverlässiges Tool für Studenten und Profis, das komplexe Berechnungen in Sekundenschnelle löst.</p>`,
        privText: `<h2>Datenschutzrichtlinie</h2><p>Der Schutz Ihrer Daten ist uns wichtig. PercentageCalculator.io sammelt keine personenbezogenen Daten wie Namen oder E-Mail-Adressen. Wir verwenden Google AdSense Cookies, um Anzeigen basierend auf Ihren Interessen zu schalten.</p><p>Ihre Verbindung zu unserer Website ist durch HTTPS verschlüsselt. Mit der Nutzung unserer Website erklären Sie sich mit der Verwendung von Cookies einverstanden.</p>`,
        termsText: `<h2>Nutzungsbedingungen</h2><p>Die Nutzung erfolgt auf eigene Gefahr. Alle Berechnungen dienen nur zur Information. Wir haften nicht für finanzielle Entscheidungen oder Rechenfehler, die durch die Nutzung dieses Tools entstehen.</p><p>Die Extraktion von Daten oder Code durch automatisierte Skripte ist strengstens untersagt.</p>`
    }
};

let cur = localStorage.getItem('lang_v_final') || 'en';

function setLang(lang) {
    cur = lang;
    localStorage.setItem('lang_v_final', lang);
    const l = data[lang];
    document.getElementById('main-title').innerText = l.title;
    document.getElementById('h3-t1').innerText = l.h1;
    document.getElementById('h3-t2').innerText = l.h2;
    document.getElementById('h3-t3').innerText = l.h3;
    document.getElementById('t1-1').innerText = l.t1_1;
    document.getElementById('t1-2').innerText = l.t1_2;
    document.getElementById('t2-1').innerText = l.t2_1;
    document.getElementById('t3-1').innerText = l.t3_1;
    document.getElementById('t3-2').innerText = l.t3_2;
    document.getElementById('t3-3').innerText = l.t3_3;
    document.getElementById('footer-copy').innerText = "© 2025 " + l.title;
    document.getElementById('link-priv').innerText = (lang==='uk'?'Конфіденційність':lang==='es'?'Privacidad':lang==='de'?'Datenschutz':'Privacy Policy');
    document.getElementById('link-terms').innerText = (lang==='uk'?'Умови':lang==='es'?'Términos':lang==='de'?'Bedingungen':'Terms of Use');
    document.getElementById('seo-content').innerHTML = l.seo;
    document.getElementById('langPicker').value = lang;
}

function calc1() {
    const p = parseFloat(document.getElementById('t1-p').value), v = parseFloat(document.getElementById('t1-v').value);
    const res = document.getElementById('t1-res');
    if(!isNaN(p) && !isNaN(v)) res.value = ((p / 100) * v).toFixed(2); else res.value = "";
}

function calc2() {
    const v1 = parseFloat(document.getElementById('t2-v1').value), v2 = parseFloat(document.getElementById('t2-v2').value);
    const res = document.getElementById('t2-res');
    if(!isNaN(v1) && !isNaN(v2) && v2 !== 0) res.value = ((v1 / v2) * 100).toFixed(2) + "%"; else res.value = "";
}

function calc3() {
    const v1 = parseFloat(document.getElementById('t3-v1').value), v2 = parseFloat(document.getElementById('t3-v2').value);
    const res = document.getElementById('t3-res');
    if(!isNaN(v1) && !isNaN(v2) && v1 !== 0) {
        const diff = ((v2 - v1) / v1) * 100;
        res.value = (diff > 0 ? "+" : "") + diff.toFixed(2) + "%";
        res.style.color = diff >= 0 ? "#22c55e" : "#ef4444";
    } else res.value = "";
}

function openModal(type) {
    const l = data[cur];
    document.getElementById('modal-body').innerHTML = type === 'privacy' ? l.privText : l.termsText;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
setLang(cur);
</script>
</body>
</html>
