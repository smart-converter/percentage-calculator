<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="8boxzAKQUKKF8IEuVEX1wX8aUwcdch3Q11BgfGM3vkM" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>PRO % CALCULATOR</title>
    <meta name="description" id="meta-desc" content="Професійний калькулятор відсотків онлайн. Швидко розраховуйте відсотки, частку та динаміку змін.">
    
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; background-color: var(--bg); color: var(--text); 
            line-height: 1.6; -webkit-font-smoothing: antialiased; 
        }

        .header { background: #1e293b; padding: 25px 20px; border-bottom: 1px solid #334155; text-align: center; }
        .header h1 { margin: 0 0 15px 0; font-size: 26px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: -1px; }

        .lang-switcher { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { background: #334155; color: white; border: 2px solid var(--accent); padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .lang-btn.active { background: var(--accent); color: var(--bg); }

        .container { max-width: 700px; margin: 0 auto; padding: 20px 15px; }

        .calc-card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 25px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .calc-card h3 { margin: 0 0 20px 0; font-size: 22px; color: var(--accent); font-weight: 900; border-left: 5px solid var(--accent); padding-left: 15px; }

        .calc-box { display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; font-size: 17px; }
        
        .input-box { flex: 1; padding: 16px; border: 2px solid #475569; border-radius: 14px; font-size: 19px; font-weight: 800; background: #0f172a; color: white; outline: none; width: 100%; box-sizing: border-box; }
        .input-box:focus { border-color: var(--accent); }
        
        .res-box { width: 100%; padding: 16px; border: 2px solid var(--success); border-radius: 14px; font-size: 22px; font-weight: 900; background: rgba(34, 197, 194, 0.1); color: var(--success); text-align: center; box-sizing: border-box; margin-top: 5px; }

        .seo-text { padding: 40px 15px; font-size: 16px; color: #cbd5e1; border-top: 1px solid #334155; text-align: justify; }
        .seo-text h2 { color: var(--accent); font-size: 28px; font-weight: 900; margin-bottom: 20px; text-align: center; }

        /* МЕРЕЖА ІНСТРУМЕНТІВ */
        .network-box { margin: 30px 0; padding: 20px; background: rgba(56, 189, 248, 0.05); border-radius: 20px; border: 1px solid #334155; }
        .network-title { font-size: 14px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        .network-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .tool-btn { text-decoration: none; background: #0f172a; color: var(--accent); border: 1px solid var(--accent); padding: 10px 20px; border-radius: 50px; font-size: 14px; font-weight: 800; transition: 0.3s; }
        .tool-btn:hover { background: var(--accent); color: #0f172a; }

        footer { padding: 60px 20px; border-top: 1px solid #334155; background: #0f172a; text-align: center; }
        .footer-wrap { max-width: 600px; margin: 0 auto; }
        #footer-copy { font-weight: 900; color: var(--accent); font-size: 22px; margin-bottom: 15px; text-transform: uppercase; }
        #footer-mission { font-size: 15px; color: #94a3b8; line-height: 1.8; margin-bottom: 30px; }
        
        .footer-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
        .footer-link { color: var(--text); font-weight: 800; font-size: 16px; cursor: pointer; border-bottom: 1px solid transparent; transition: 0.3s; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 40px 30px; width: 85%; max-width: 500px; border-radius: 25px; border: 2px solid var(--accent); position: relative; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 35px; color: var(--accent); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">PRO % CALCULATOR</h1>
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENGLISH</button>
        <button class="lang-btn" onclick="setLang('uk')" id="btn-uk">УКРАЇНСЬКА</button>
        <button class="lang-btn" onclick="setLang('es')" id="btn-es">ESPAÑOL</button>
        <button class="lang-btn" onclick="setLang('de')" id="btn-de">DEUTSCH</button>
    </div>
</div>

<div class="container">
    <div class="calc-card">
        <h3 id="h3-t1">Find Percentage Value</h3>
        <div class="calc-box">
            <div class="input-row"><span id="t1-1">What is</span> <input type="number" id="t1-p" class="input-box" oninput="calc1()" placeholder="%"> <span id="t1-2">% of</span></div>
            <input type="number" id="t1-v" class="input-box" oninput="calc1()" placeholder="Number">
            <input type="text" id="t1-res" class="res-box" readonly placeholder="Result">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t2">Ratio Analysis</h3>
        <div class="calc-box">
            <input type="number" id="t2-v1" class="input-box" oninput="calc2()" placeholder="Value 1">
            <div class="input-row"><span id="t2-1">is what % of</span> <input type="number" id="t2-v2" class="input-box" oninput="calc2()" placeholder="Value 2"></div>
            <input type="text" id="t2-res" class="res-box" readonly placeholder="Result %">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t3">Percentage Change</h3>
        <div class="calc-box">
            <div class="input-row"><span id="t3-1">From</span> <input type="number" id="t3-v1" class="input-box" oninput="calc3()"> <span id="t3-2">to</span></div>
            <input type="number" id="t3-v2" class="input-box" oninput="calc3()">
            <input type="text" id="t3-res" class="res-box" readonly placeholder="Difference %">
        </div>
    </div>

    <div class="network-box">
        <div class="network-title" id="txt-network">Our Elite Tools:</div>
        <div class="network-links">
            <a href="https://smart-converter.github.io/vat-calculator/" class="tool-btn">VAT Calculator</a>
            <a href="https://smart-converter.github.io/unit-converter/" class="tool-btn">Unit Converter</a>
        </div>
    </div>

    <div class="seo-text" id="seo-content"></div>
</div>

<footer>
    <div class="footer-wrap">
        <div id="footer-copy">PRO % CALCULATOR</div>
        <p id="footer-mission"></p>
        <div class="footer-links">
            <span class="footer-link" onclick="openModal('privacy')" id="link-priv"></span>
            <span class="footer-link" onclick="openModal('terms')" id="link-terms"></span>
        </div>
        <div style="font-size: 12px; color: #475569; font-weight: 700;">© 2026 PRO Percentage Team.</div>
    </div>
</footer>

<div id="modal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
const data = {
    en: {
        pageTitle: "PRO % CALCULATOR | Financial Precision",
        meta: "Free online percentage calculator. Fast, accurate tool for finance.",
        title: "PRO % CALCULATOR", h1: "Find Percentage Value", h2: "Ratio Analysis", h3: "Percentage Change",
        t1_1: "What is", t1_2: "% of", t2_1: "is what % of", t3_1: "From", t3_2: "to",
        network: "Our Elite Tools:", mission: "Our global mission is to provide the fastest financial tools.",
        privLabel: "Privacy Policy", termsLabel: "Terms",
        seo: `<h2>Advanced Percentage Solutions</h2><p>Our professional Percentage Calculator is optimized for business.</p>`,
        privText: `<h2>Privacy Policy</h2><p>We do not collect personal data.</p>`,
        termsText: `<h2>Terms</h2><p>For informational purposes only.</p>`
    },
    uk: {
        pageTitle: "PRO % КАЛЬКУЛЯТОР | Точність розрахунків",
        meta: "Безкоштовний калькулятор відсотків онлайн.",
        title: "PRO % КАЛЬКУЛЯТОР", h1: "Розрахунок % від числа", h2: "Відсоткове співвідношення", h3: "Динаміка зміни",
        t1_1: "Скільки", t1_2: "% від", t2_1: "це який % від", t3_1: "З", t3_2: "до",
        network: "Наші інструменти:", mission: "Наша місія — надати кожному найшвидші та найточніші фінансові інструменти.",
        privLabel: "Конфіденційність", termsLabel: "Умови",
        seo: `<h2>Професійний розрахунок відсотків</h2><p>Наш інструмент створений для тих, кому потрібна максимальна швидкість.</p>`,
        privText: `<h2>Конфіденційність</h2><p>Ми не збираємо ваші персональні дані.</p>`,
        termsText: `<h2>Умови</h2><p>Результати мають інформаційний характер.</p>`
    }
};

let cur = 'uk';

function setLang(lang) {
    cur = lang;
    const l = data[lang] || data['en'];
    document.title = l.pageTitle;
    document.getElementById('main-title').innerText = l.title;
    document.getElementById('h3-t1').innerText = l.h1;
    document.getElementById('h3-t2').innerText = l.h2;
    document.getElementById('h3-t3').innerText = l.h3;
    document.getElementById('t1-1').innerText = l.t1_1;
    document.getElementById('t1-2').innerText = l.t1_2;
    document.getElementById('t2-1').innerText = l.t2_1;
    document.getElementById('t3-1').innerText = l.t3_1;
    document.getElementById('t3-2').innerText = l.t3_2;
    document.getElementById('seo-content').innerHTML = l.seo;
    document.getElementById('footer-mission').innerText = l.mission;
    document.getElementById('link-priv').innerText = l.privLabel;
    document.getElementById('link-terms').innerText = l.termsLabel;
    document.getElementById('footer-copy').innerText = l.title;
    document.getElementById('txt-network').innerText = l.network;

    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
}

function calc1() {
    const p = parseFloat(document.getElementById('t1-p').value), v = parseFloat(document.getElementById('t1-v').value);
    document.getElementById('t1-res').value = (p && v) ? ((p / 100) * v).toFixed(2) : "";
}

function calc2() {
    const v1 = parseFloat(document.getElementById('t2-v1').value), v2 = parseFloat(document.getElementById('t2-v2').value);
    document.getElementById('t2-res').value = (v1 && v2) ? ((v1 / v2) * 100).toFixed(2) + "%" : "";
}

function calc3() {
    const v1 = parseFloat(document.getElementById('t3-v1').value), v2 = parseFloat(document.getElementById('t3-v2').value);
    const res = document.getElementById('t3-res');
    if(v1 && v2) {
        const diff = ((v2 - v1) / v1) * 100;
        res.value = (diff > 0 ? "+" : "") + diff.toFixed(2) + "%";
        res.style.color = diff >= 0 ? "#22c55e" : "#ef4444";
    } else res.value = "";
}

function openModal(type) {
    const l = data[cur];
    document.getElementById('modal-body').innerHTML = type === 'privacy' ? l.privText : l.termsText;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

setLang('uk');
</script>
</body>
</html>
