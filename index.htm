<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator Pro - Fast & Accurate Online Tool</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
            --text-muted: #94a3b8; /* Зробив трохи м'якшим як у Unit */
            --border-color: #334155;
            --border-glow: rgba(255, 255, 255, 0.1);
        }

        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-light); -webkit-font-smoothing: antialiased; }
        
        .top-header { background-color: #166534; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .top-header h1 { margin: 0; font-size: 18px; font-weight: 900; color: white; }
        .lang-switcher { background: transparent; border: 1px solid white; color: white; padding: 3px 7px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 700; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box; min-height: 100vh; }
        
        .tabs-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; 
            background-color: #14532d; border: 1px solid #14532d; 
            margin: 10px 0; border-radius: 8px; overflow: hidden;
        }
        .tab { background: #166534; color: #fff; height: 44px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; border: none; }
        .tab.active { background: #fff; color: #166534; }
        
        .ad-space { 
            background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--border-color); 
            margin: 10px 0; text-align: center; color: var(--text-muted); 
            font-size: 10px; height: 90px; display: flex; align-items: center; justify-content: center; border-radius: 8px; 
        }
        
        .converter-box { border: 1px solid var(--border-color); padding: 20px; background: var(--card-bg); border-radius: 12px; }
        .row { display: flex; align-items: center; margin-bottom: 12px; }
        .row label { width: 120px; font-size: 14px; color: var(--text-muted); font-weight: 600; }
        
        /* ТУТ ВИПРАВЛЕНО НА СТИЛЬ UNIT */
        .input-field { 
            flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; 
            font-size: 17px; font-weight: 700; background: #0f172a; color: #fff; outline: none; width: 100%; box-sizing: border-box; 
        }
        .res-field { color: var(--accent-green) !important; border-color: var(--accent-green) !important; background: rgba(34, 197, 94, 0.05) !important; }

        .seo-content { padding: 15px 5px; line-height: 1.6; font-size: 14px; color: var(--text-muted); }
        .seo-content h2 { color: var(--accent-green); font-size: 18px; margin: 20px 0 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; font-weight: 800; }

        .tools-network { padding: 20px 0; text-align: center; border-top: 1px solid var(--border-color); margin-top: 10px; }
        .tools-network h4 { margin: 0 0 15px 0; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* ОБМЕЖЕННЯ ШИРИНИ СІТКИ ЯК У UNIT */
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 400px; margin: 0 auto; }
        .tool-link-btn { padding: 10px 5px; border: 1px solid var(--accent-green); color: var(--accent-green); text-decoration: none; border-radius: 8px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; height: 40px; box-sizing: border-box; }
        .tool-link-btn:last-child:nth-child(odd) { grid-column: 1 / span 2; justify-self: center; width: calc(50% - 4px); }

        footer { border-top: 1px solid var(--border-color); padding: 25px 15px; text-align: center; }
        /* КОМПАКТНИЙ ТЕКСТОВИЙ БЛОК */
        .footer-info-block { border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin: 0 auto 20px auto; background: rgba(255, 255, 255, 0.02); text-align: left; max-width: 500px; font-size: 12px; line-height: 1.5; color: var(--text-muted); }
        .footer-link { color: var(--accent-green); text-decoration: none; cursor: pointer; padding: 0 10px; font-weight: 700; font-size: 12px; }
        
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 25px; width: 85%; max-width: 500px; border-radius: 12px; position: relative; border: 1px solid var(--border-color); color: white; }
        .close-btn { position: absolute; right: 10px; top: 0; font-size: 32px; cursor: pointer; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="top-header">
    <h1>SmartPercentage.io</h1>
    <select class="lang-switcher" onchange="changeLang(this.value)" id="langSelect">
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
    </select>
</div>

<div class="container">
    <div id="tabs" class="tabs-grid"></div>
    <div class="ad-space">ADVERTISEMENT</div>
    
    <div class="converter-box">
        <div id="calc-ui"></div>
        <div class="row" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <label id="lbl-result" for="valOut">Result:</label>
            <input type="text" id="valOut" class="input-field res-field" readonly>
        </div>
    </div>

    <div class="seo-content" id="seo-box"></div>

    <div class="tools-network">
        <h4 id="txt-other-tools">Other Elite Tools</h4>
        <div class="tools-grid">
            <a href="https://smart-converter.github.io/unit-converter/" class="tool-link-btn" id="lnk-unit">Unit Converter</a>
            <a href="https://smart-converter.github.io/currency-converter/" class="tool-link-btn" id="lnk-cur">Currency Converter</a>
            <a href="https://smart-converter.github.io/vat-calculator/" class="tool-link-btn" id="lnk-vat">VAT Calculator</a>
            <a href="https://smart-converter.github.io/loan-calculator/" class="tool-link-btn" id="lnk-loan">Loan Calculator</a>
            <a href="https://smart-converter.github.io/discount-calculator/" class="tool-link-btn" id="lnk-disc">Discount Calc</a>
            <a href="https://smart-converter.github.io/tip-calculator/" class="tool-link-btn" id="lnk-tip">Tip Calculator</a>
            <a href="https://smart-converter.github.io/bmi-calculator/" class="tool-link-btn" id="lnk-bmi">BMI Calculator</a>
        </div>
    </div>
</div>

<footer>
    <div class="footer-info-block" id="footer-full-text"></div>
    <p style="font-size: 11px; margin-bottom: 10px;">© 2026 SmartPercentage.io - Precise Financial Tools</p>
    <div>
        <span class="footer-link" onclick="openPol('privacy')" id="link-privacy">Privacy Policy</span>
        <span class="footer-link" onclick="openPol('terms')" id="link-terms">Terms of Use</span>
    </div>
</footer>

<div id="siteModal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content"><span class="close-btn" onclick="closeModal()">×</span><div id="modalBody"></div></div>
</div>

<script>
    const translations = {
        en: {
            res: "Result:", other: "Other Elite Tools", cats: ["Basic %", "Difference", "Increase"],
            l1: "Percentage %", l2: "Of Number", l3: "Initial Value", l4: "Final Value", l5: "Value",
            unit: "Unit Converter", cur: "Currency Converter", vat: "VAT Calculator", loan: "Loan Calculator", disc: "Discount Calc", tip: "Tip Calculator", bmi: "BMI Calculator",
            footer: "SmartPercentage.io is your go-to destination for high-precision percentage calculations. We use advanced algorithms to ensure that every calculation is 100% accurate.",
            seo: `<h2>Why Use Our Calculator?</h2><p>Our tool supports three main modes: finding a percentage of a number, calculating differences, and adding increases.</p>`,
            privacy: "Privacy Policy", terms: "Terms of Use",
            privText: "<h2>Privacy Policy</h2><p>We do not store any data. All calculations are performed instantly in your browser.</p>",
            termsText: "<h2>Terms of Use</h2><p>Our tools are for informational purposes. Verify results for critical tasks.</p>"
        },
        uk: {
            res: "Результат:", other: "Інші інструменти", cats: ["Базовий %", "Різниця", "Приріст"],
            l1: "Відсоток %", l2: "Від числа", l3: "Початкове", l4: "Кінцеве", l5: "Значення",
            unit: "Конвертер", cur: "Валюти", vat: "ПДВ", loan: "Кредити", disc: "Знижки", tip: "Чайові", bmi: "Індекс маси",
            footer: "SmartPercentage.io — ваш надійний помічник для розрахунків відсотків. Ми гарантуємо точність кожного обчислення.",
            seo: `<h2>Навіщо потрібен наш калькулятор?</h2><p>Інструмент підтримує три режими: знаходження відсотка, різниці та приросту.</p>`,
            privacy: "Конфіденційність", terms: "Умови",
            privText: "<h2>Конфіденційність</h2><p>Ми не зберігаємо ваші дані. Розрахунки локальні.</p>",
            termsText: "<h2>Умови використання</h2><p>Інструменти надаються для інформаційних цілей.</p>"
        }
    };

    let curLang = localStorage.getItem('lang_perc') || 'en';
    let currentTab = 0;

    function changeLang(lang) { 
        curLang = lang; 
        localStorage.setItem('lang_perc', lang); 
        updateUI(); 
    }

    function updateUI() {
        const l = translations[curLang] || translations.en;
        document.getElementById('langSelect').value = curLang;
        document.getElementById('lbl-result').innerText = l.res;
        document.getElementById('txt-other-tools').innerText = l.other;
        document.getElementById('footer-full-text').innerText = l.footer;
        document.getElementById('link-privacy').innerText = l.privacy;
        document.getElementById('link-terms').innerText = l.terms;
        document.getElementById('seo-box').innerHTML = l.seo;
        
        document.getElementById('lnk-unit').innerText = l.unit;
        document.getElementById('lnk-cur').innerText = l.cur;
        document.getElementById('lnk-vat').innerText = l.vat;
        document.getElementById('lnk-loan').innerText = l.loan;
        document.getElementById('lnk-disc').innerText = l.disc;
        document.getElementById('lnk-tip').innerText = l.tip;
        document.getElementById('lnk-bmi').innerText = l.bmi;
        
        initTabs();
    }

    function initTabs() {
        const t = document.getElementById('tabs'); t.innerHTML = '';
        const l = translations[curLang] || translations.en;
        l.cats.forEach((cat, i) => {
            const d = document.createElement('div');
            d.className = `tab ${i === currentTab ? 'active' : ''}`;
            d.innerText = cat;
            d.onclick = () => { currentTab = i; initTabs(); renderCalc(); };
            t.appendChild(d);
        });
        renderCalc();
    }

    function renderCalc() {
        const l = translations[curLang] || translations.en;
        const container = document.getElementById('calc-ui');
        let html = '';
        if (currentTab === 0) {
            html = `<div class="row"><label for="v1">${l.l1}:</label><input type="number" id="v1" class="input-field" value="10" oninput="calc()"></div>
                    <div class="row"><label for="v2">${l.l2}:</label><input type="number" id="v2" class="input-field" value="100" oninput="calc()"></div>`;
        } else if (currentTab === 1) {
            html = `<div class="row"><label for="v1">${l.l3}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label for="v2">${l.l4}:</label><input type="number" id="v2" class="input-field" value="125" oninput="calc()"></div>`;
        } else {
            html = `<div class="row"><label for="v1">${l.l5}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label for="v2">${l.l1} (+):</label><input type="number" id="v2" class="input-field" value="20" oninput="calc()"></div>`;
        }
        container.innerHTML = html;
        calc();
    }

    function calc() {
        const a = parseFloat(document.getElementById('v1').value) || 0;
        const b = parseFloat(document.getElementById('v2').value) || 0;
        const out = document.getElementById('valOut');
        let res = 0;
        if (currentTab === 0) res = a * (b / 100);
        else if (currentTab === 1) res = a !== 0 ? ((b - a) / a) * 100 : 0;
        else res = a + (a * (b / 100));
        
        out.value = currentTab === 1 ? res.toFixed(2) + "%" : res.toLocaleString(undefined, {maximumFractionDigits: 2});
    }

    function openPol(type) {
        const l = translations[curLang] || translations.en;
        document.getElementById('modalBody').innerHTML = type === 'privacy' ? l.privText : l.termsText;
        document.getElementById('siteModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('siteModal').style.display = 'none'; }

    updateUI();
</script>
</body>
</html>
