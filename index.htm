<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO Percentage Calculator</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; background-color: var(--bg); color: var(--text); 
            line-height: 1.6; -webkit-font-smoothing: antialiased; 
        }

        .header { background: #1e293b; padding: 25px 20px; border-bottom: 1px solid #334155; text-align: center; }
        .header h1 { margin: 0 0 15px 0; font-size: 26px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: -1px; }

        .lang-switcher { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { background: #334155; color: white; border: 2px solid var(--accent); padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .lang-btn.active { background: var(--accent); color: var(--bg); }

        .container { max-width: 700px; margin: 0 auto; padding: 20px 15px; }

        .calc-card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 25px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .calc-card h3 { margin: 0 0 20px 0; font-size: 22px; color: var(--accent); font-weight: 900; border-left: 5px solid var(--accent); padding-left: 15px; }

        .calc-box { display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; font-size: 17px; }
        
        .input-box { flex: 1; padding: 16px; border: 2px solid #475569; border-radius: 14px; font-size: 19px; font-weight: 800; background: #0f172a; color: white; outline: none; width: 100%; box-sizing: border-box; }
        .res-box { width: 100%; padding: 16px; border: 2px solid var(--success); border-radius: 14px; font-size: 22px; font-weight: 900; background: rgba(34, 197, 94, 0.1); color: var(--success); text-align: center; box-sizing: border-box; margin-top: 5px; }

        .seo-text { padding: 40px 15px; font-size: 16px; color: #cbd5e1; border-top: 1px solid #334155; text-align: justify; }
        .seo-text h2 { color: var(--accent); font-size: 28px; font-weight: 900; margin-bottom: 20px; text-align: center; }

        footer { padding: 60px 20px; border-top: 1px solid #334155; background: #0f172a; text-align: center; }
        .footer-wrap { max-width: 600px; margin: 0 auto; }
        #footer-copy { font-weight: 900; color: var(--accent); font-size: 22px; margin-bottom: 15px; text-transform: uppercase; }
        #footer-mission { font-size: 15px; color: #94a3b8; line-height: 1.8; margin-bottom: 30px; text-align: justify; text-align-last: center; }
        
        .footer-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
        .footer-link { color: var(--text); font-weight: 800; font-size: 16px; cursor: pointer; border-bottom: 1px solid transparent; }

        /* МОДАЛЬНЕ ВІКНО */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 40px 30px; width: 85%; max-width: 500px; border-radius: 25px; border: 2px solid var(--accent); position: relative; max-height: 70vh; overflow-y: auto; text-align: justify; }
        .close { position: sticky; top: -10px; float: right; font-size: 35px; color: var(--accent); cursor: pointer; z-index: 10; font-weight: bold; }

        @media (max-width: 600px) {
            .header h1 { font-size: 22px; }
            .modal-content { margin: 20% auto; padding: 25px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">PRO % CALCULATOR</h1>
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENGLISH</button>
        <button class="lang-btn" onclick="setLang('uk')" id="btn-uk">УКРАЇНСЬКА</button>
        <button class="lang-btn" onclick="setLang('es')" id="btn-es">ESPAÑOL</button>
        <button class="lang-btn" onclick="setLang('de')" id="btn-de">DEUTSCH</button>
    </div>
</div>

<div class="container">
    <div class="calc-card">
        <h3 id="h3-t1">Find Percentage Value</h3>
        <div class="calc-box">
            <div class="input-row"><span id="t1-1">What is</span> <input type="number" id="t1-p" class="input-box" oninput="calc1()" placeholder="%"> <span id="t1-2">% of</span></div>
            <input type="number" id="t1-v" class="input-box" oninput="calc1()" placeholder="Number">
            <input type="text" id="t1-res" class="res-box" readonly placeholder="Result">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t2">Ratio Analysis</h3>
        <div class="calc-box">
            <input type="number" id="t2-v1" class="input-box" oninput="calc2()" placeholder="Value 1">
            <div class="input-row"><span id="t2-1">is what % of</span> <input type="number" id="t2-v2" class="input-box" oninput="calc2()" placeholder="Value 2"></div>
            <input type="text" id="t2-res" class="res-box" readonly placeholder="Result %">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t3">Percentage Change</h3>
        <div class="calc-box">
            <div class="input-row"><span id="t3-1">From</span> <input type="number" id="t3-v1" class="input-box" oninput="calc3()"> <span id="t3-2">to</span></div>
            <input type="number" id="t3-v2" class="input-box" oninput="calc3()">
            <input type="text" id="t3-res" class="res-box" readonly placeholder="Difference %">
        </div>
    </div>

    <div class="seo-text" id="seo-content"></div>
</div>

<footer>
    <div class="footer-wrap">
        <div id="footer-copy">PRO % CALCULATOR</div>
        <p id="footer-mission"></p>
        <div class="footer-links">
            <span class="footer-link" onclick="openModal('privacy')" id="link-priv"></span>
            <span class="footer-link" onclick="openModal('terms')" id="link-terms"></span>
        </div>
        <div style="font-size: 12px; color: #475569; font-weight: 700;">© 2025 PRO Percentage Team. All Rights Reserved.</div>
    </div>
</footer>

<div id="modal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
const data = {
    en: {
        title: "PRO % CALCULATOR", h1: "Find Percentage Value", h2: "Ratio Analysis", h3: "Percentage Change",
        t1_1: "What is", t1_2: "% of", t2_1: "is what % of", t3_1: "From", t3_2: "to",
        mission: "Our global mission is to provide the fastest, most reliable and extremely accurate financial calculation tools for everyone. From high school students to professional wall street traders, we make complex mathematics simple, accessible, and completely intuitive for every single user worldwide. We believe in the power of precision and speed for every calculation you make on our platform.",
        privLabel: "Privacy Policy", termsLabel: "Terms of Use",
        seo: `<h2>Advanced Percentage Solutions</h2><p>Our professional Percentage Calculator is optimized for both business and personal finance. Calculate sales tax, investment ROI, and discounts with high-speed algorithms designed for modern web standards.</p>`,
        privText: `<h2>Privacy Policy</h2><p>Your privacy is our absolute priority. We do not collect, store, or share any personal data or calculation history. Our tool operates entirely on your local device, ensuring that your financial data remains 100% private, secure, and anonymous at all times while using our services.</p>`,
        termsText: `<h2>Terms of Service</h2><p>All calculations provided by this website are for informational and educational purposes only. While we strive for 100% mathematical accuracy through rigorous testing, we are not responsible for any financial decisions, losses, or actions taken based on these results. Users are encouraged to verify critical data independently.</p>`
    },
    uk: {
        title: "PRO % КАЛЬКУЛЯТОР", h1: "Розрахунок % від числа", h2: "Відсоткове співвідношення", h3: "Динаміка зміни",
        t1_1: "Скільки", t1_2: "% від", t2_1: "це який % від", t3_1: "З", t3_2: "до",
        mission: "Наша глобальна місія — надати кожному користувачу найшвидші та найточніші фінансові інструменти. Від студентів до професійних трейдерів, ми робимо складну математику простою, доступною та зрозумілою для кожного в усьому світі. Ми віримо, що точність кожного розрахунку є фундаментом для прийняття правильних фінансових рішень у сучасному динамічному світі.",
        privLabel: "Конфіденційність", termsLabel: "Умови використання",
        seo: `<h2>Професійний розрахунок відсотків</h2><p>Наш інструмент створений для тих, кому потрібна максимальна швидкість і точність. Рахуйте ПДВ, маржу або складні знижки за лічені секунди без зайвих зусиль та реєстрацій.</p>`,
        privText: `<h2>Політика конфіденційності</h2><p>Ваша приватність є нашим головним пріоритетом. Ми принципово не збираємо ваші персональні дані, IP-адреси або історію розрахунків. Всі обчислення відбуваються виключно на вашому пристрої, що гарантує повну анонімність, безпеку та конфіденційність ваших фінансових операцій.</p>`,
        termsText: `<h2>Умови використання</h2><p>Результати розрахунків на цьому сайті мають виключно інформаційний та ознайомчий характер. Ми не несемо відповідальності за будь-які фінансові збитки або ризики, що можуть виникнути внаслідок використання цих даних. Користувач несе відповідальність за перевірку результатів.</p>`
    },
    es: {
        title: "PRO % CALCULADORA", h1: "Calcular Porcentaje", h2: "Relación de Números", h3: "Tasa de Cambio",
        t1_1: "Qué es el", t1_2: "% de", t2_1: "es qué % de", t3_1: "De", t3_2: "a",
        mission: "Nuestra misión global es proporcionar las herramientas financieras más rápidas, confiables y extremadamente precisas para todos. Desde estudiantes de secundaria hasta operadores profesionales, hacemos que las matemáticas complejas sean simples, accesibles y completamente intuitivas para cada usuario en todo el mundo. Creemos firmemente en la importancia de la precisión y la velocidad en cada cálculo.",
        privLabel: "Privacidad", termsLabel: "Términos de Uso",
        seo: `<h2>Calculadora de Porcentajes Elite</h2><p>Optimice sus cálculos financieros con nuestra herramienta de alta precisión. Ideal para negocios, análisis de mercado y finanzas personales. Calcule impuestos, ROI y descuentos con algoritmos de alta velocidad.</p>`,
        privText: `<h2>Política de Privacidad</h2><p>No recopilamos información personal. Tu privacidad está garantizada. Nuestra herramienta funciona localmente en su navegador y no comparte datos confidenciales con servidores externos para su total seguridad.</p>`,
        termsText: `<h2>Términos de Servicio</h2><p>Todos los cálculos proporcionados son solo para fines informativos y educativos. Aunque nos esforzamos por lograr una precisión total, no somos responsables de ninguna decisión financiera o pérdida basada en estos resultados. Se recomienda verificar los datos.</p>`
    },
    de: {
        title: "PRO % RECHNER", h1: "Prozentwert finden", h2: "Verhältnis in %", h3: "Änderungsrate",
        t1_1: "Was sind", t1_2: "% von", t2_1: "ist wie viel % von", t3_1: "Von", t3_2: "auf",
        mission: "Unsere globale Mission ist es, jedem Benutzer die schnellsten, zuverlässigsten und präzisesten Finanzberechnungstools zur Verfügung zu stellen. Wir machen komplexe Mathematik einfach, zugänglich und intuitiv für jeden Benutzer weltweit. Wir glauben an die Kraft von Präzision und Geschwindigkeit bei jeder einzelnen Berechnung.",
        privLabel: "Datenschutz", termsLabel: "Bedingungen",
        seo: `<h2>Premium Prozentrechner Online</h2><p>Präzise Ergebnisse für Business und Alltag. Berechnen Sie Steuern, Rabatte und Zinsen sofort mit unseren hocheffizienten Algorithmen, die für maximale Genauigkeit entwickelt wurden.</p>`,
        privText: `<h2>Datenschutzerklärung</h2><p>Ihre Privatsphäre hat Priorität. Wir sammeln keine personenbezogenen Daten. Unser Tool läuft vollständig lokal auf Ihrem Gerät, sodass Ihre Finanzdaten jederzeit zu 100% privat і sicher bleiben.</p>`,
        termsText: `<h2>Nutzungsbedingungen</h2><p>Alle Berechnungen dienen ausschließlich Informationszwecken. Obwohl wir eine 100%ige Genauigkeit anstreben, haften wir nicht für finanzielle Verluste, die auf diesen Ergebnissen basieren. Nutzer sollten Daten unabhängig prüfen.</p>`
    }
};

let cur = 'uk';

function setLang(lang) {
    cur = lang;
    const l = data[lang];
    document.getElementById('main-title').innerText = l.title;
    document.getElementById('h3-t1').innerText = l.h1;
    document.getElementById('h3-t2').innerText = l.h2;
    document.getElementById('h3-t3').innerText = l.h3;
    document.getElementById('t1-1').innerText = l.t1_1;
    document.getElementById('t1-2').innerText = l.t1_2;
    document.getElementById('t2-1').innerText = l.t2_1;
    document.getElementById('t3-1').innerText = l.t3_1;
    document.getElementById('t3-2').innerText = l.t3_2;
    document.getElementById('seo-content').innerHTML = l.seo;
    document.getElementById('footer-mission').innerText = l.mission;
    document.getElementById('link-priv').innerText = l.privLabel;
    document.getElementById('link-terms').innerText = l.termsLabel;
    document.getElementById('footer-copy').innerText = l.title;

    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
}

function calc1() {
    const p = parseFloat(document.getElementById('t1-p').value), v = parseFloat(document.getElementById('t1-v').value);
    document.getElementById('t1-res').value = (p && v) ? ((p / 100) * v).toFixed(2) : "";
}

function calc2() {
    const v1 = parseFloat(document.getElementById('t2-v1').value), v2 = parseFloat(document.getElementById('t2-v2').value);
    document.getElementById('t2-res').value = (v1 && v2) ? ((v1 / v2) * 100).toFixed(2) + "%" : "";
}

function calc3() {
    const v1 = parseFloat(document.getElementById('t3-v1').value), v2 = parseFloat(document.getElementById('t3-v2').value);
    const res = document.getElementById('t3-res');
    if(v1 && v2) {
        const diff = ((v2 - v1) / v1) * 100;
        res.value = (diff > 0 ? "+" : "") + diff.toFixed(2) + "%";
        res.style.color = diff >= 0 ? "#22c55e" : "#ef4444";
    } else res.value = "";
}

function openModal(type) {
    const l = data[cur];
    document.getElementById('modal-body').innerHTML = type === 'privacy' ? l.privText : l.termsText;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
setLang('uk');
</script>
</body>
</html>
