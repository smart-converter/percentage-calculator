<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="8boxzAKQUKKF8IEuVEX1wX8aUwcdch3Q11BgfGM3vkM" />
    <title>PRO % CALCULATOR</title>
    <meta name="description" id="meta-desc" content="Професійний калькулятор відсотків онлайн. Швидко розраховуйте відсотки, частку та динаміку змін.">
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --accent: #38bdf8; --success: #22c55e; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; }
        .header { background: #1e293b; padding: 25px 20px; border-bottom: 1px solid #334155; text-align: center; }
        .header h1 { margin: 0 0 15px 0; font-size: 26px; font-weight: 900; color: var(--accent); text-transform: uppercase; }
        .lang-switcher { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { background: #334155; color: white; border: 2px solid var(--accent); padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; }
        .lang-btn.active { background: var(--accent); color: var(--bg); }
        .container { max-width: 700px; margin: 0 auto; padding: 20px 15px; }
        .calc-card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 25px; border: 1px solid #334155; }
        .calc-card h3 { margin: 0 0 20px 0; font-size: 22px; color: var(--accent); font-weight: 900; border-left: 5px solid var(--accent); padding-left: 15px; }
        .input-box { width: 100%; padding: 16px; border: 2px solid #475569; border-radius: 14px; font-size: 19px; font-weight: 800; background: #0f172a; color: white; box-sizing: border-box; margin-bottom: 10px; }
        .res-box { width: 100%; padding: 16px; border: 2px solid var(--success); border-radius: 14px; font-size: 22px; font-weight: 900; background: rgba(34, 197, 94, 0.1); color: var(--success); text-align: center; box-sizing: border-box; }
        footer { padding: 60px 20px; border-top: 1px solid #334155; text-align: center; }
        .footer-link { color: var(--text); font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: none; margin: 0 10px; }
        .footer-link:hover { color: var(--accent); }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 30px; width: 85%; max-width: 500px; border-radius: 25px; border: 2px solid var(--accent); color: white; }
    </style>
</head>
<body>
<div class="header">
    <h1 id="main-title">PRO % CALCULATOR</h1>
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENGLISH</button>
        <button class="lang-btn" onclick="setLang('uk')" id="btn-uk">УКРАЇНСЬКА</button>
    </div>
</div>
<div class="container">
    <div class="calc-card">
        <h3 id="h3-t1">Find Percentage Value</h3>
        <input type="number" id="t1-p" class="input-box" oninput="calc1()" placeholder="%">
        <input type="number" id="t1-v" class="input-box" oninput="calc1()" placeholder="Number">
        <input type="text" id="t1-res" class="res-box" readonly placeholder="Result">
    </div>
    <div id="seo-content" style="padding: 20px; font-size: 14px; color: #94a3b8;"></div>
</div>
<footer>
    <div id="footer-copy" style="font-weight:900; color:var(--accent); margin-bottom:15px;">PRO % CALCULATOR</div>
    <div class="footer-links">
        <span class="footer-link" onclick="openModal('privacy')">Privacy</span>
        <span class="footer-link" onclick="openModal('terms')">Terms</span>
        <a href="https://smart-converter.github.io/unit-converter/" class="footer-link">Unit Converter</a>
    </div>
</footer>
<div id="modal" class="modal" onclick="closeModal()"><div class="modal-content" id="modal-body"></div></div>
<script>
const data = {
    en: { title: "PRO % CALCULATOR", h1: "Percentage Value", priv: "Privacy Policy", terms: "Terms", seo: "Professional calculations." },
    uk: { title: "PRO % КАЛЬКУЛЯТОР", h1: "Розрахунок % від числа", priv: "Конфіденційність", terms: "Умови", seo: "Професійні розрахунки." }
};
let cur = 'uk';
function setLang(l) { cur = l; document.getElementById('main-title').innerText = data[l].title; document.getElementById('h3-t1').innerText = data[l].h1; document.getElementById('seo-content').innerText = data[l].seo; }
function calc1() { const p = document.getElementById('t1-p').value, v = document.getElementById('t1-v').value; document.getElementById('t1-res').value = (p && v) ? ((p / 100) * v).toFixed(2) : ""; }
function openModal(t) { document.getElementById('modal-body').innerText = t === 'privacy' ? data[cur].priv : data[cur].terms; document.getElementById('modal').style.display = 'block'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }
setLang('uk');
</script>
</body>
</html>
