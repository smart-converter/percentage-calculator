<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator Pro - Elite Tool</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; -webkit-font-smoothing: antialiased; }
        .top-header { background-color: #166534; padding: 20px 15px; text-align: center; border-bottom: 1px solid #1e293b; }
        .top-header h1 { margin: 0; font-size: 22px; font-weight: 700; color: #ffffff; text-transform: uppercase; }
        
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; max-width: 500px; margin: 0 auto; }
        .lang-btn { padding: 10px; text-align: center; background: #1e293b; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-size: 13px; color: #94a3b8; }
        .lang-btn.active { background: #22c55e; color: #ffffff; border-color: #22c55e; font-weight: bold; }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .calc-section { background: #1e293b; padding: 25px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin-bottom: 25px; }
        
        label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .input-box { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 18px; font-weight: 700; box-sizing: border-box; margin-bottom: 15px; outline: none; }
        .input-box:focus { border-color: #22c55e; }

        .res-container { background: rgba(34, 197, 94, 0.05); border: 1px dashed #22c55e; border-radius: 12px; padding: 15px; text-align: center; margin-top: 5px; }
        .res-val { font-size: 24px; font-weight: 800; color: #22c55e; }

        .seo-content { max-width: 500px; margin: 20px auto; padding: 0 20px; line-height: 1.6; color: #64748b; font-size: 14px; }
        .seo-content h2 { color: #22c55e; font-size: 18px; margin-bottom: 10px; }

        .network-tools { max-width: 500px; margin: 20px auto; text-align: center; padding: 15px; border-top: 1px solid #1e293b; }
        .tool-link { display: inline-block; color: #22c55e; text-decoration: none; font-size: 13px; margin: 5px 10px; border: 1px solid #22c55e; padding: 5px 12px; border-radius: 20px; }

        footer { padding: 25px 20px; text-align: center; background: #0f172a; border: 1px solid #1e293b; border-radius: 15px; margin: 20px auto; max-width: 460px; }
        .footer-link { color: #22c55e; text-decoration: none; cursor: pointer; font-weight: bold; font-size: 13px; margin: 0 10px; }

        .modal { display: none; position: fixed; z-index: 99; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.9); }
        .modal-content { background: #1e293b; margin: 15% auto; padding: 30px; width: 85%; max-width: 400px; border-radius: 20px; border: 1px solid #334155; position: relative; }
        .close { position: absolute; right: 15px; top: 10px; font-size: 35px; font-weight: 900; color: #22c55e; cursor: pointer; }
    </style>
</head>
<body>

<div class="top-header"><h1>% CALCULATOR ELITE</h1></div>

<div class="lang-grid">
    <div class="lang-btn" onclick="changeLang('en')" id="btn-en">ENGLISH</div>
    <div class="lang-btn" onclick="changeLang('uk')" id="btn-uk">УКРАЇНСЬКА</div>
    <div class="lang-btn" onclick="changeLang('es')" id="btn-es">ESPAÑOL</div>
    <div class="lang-btn" onclick="changeLang('de')" id="btn-de">DEUTSCH</div>
</div>

<div class="container">
    <div class="calc-section">
        <h3 style="margin:0 0 15px 0; font-size:16px; color:#22c55e;" id="title-1">What is X% of Y?</h3>
        <label id="lbl-perc">Percentage (%)</label>
        <input type="number" id="p1" class="input-box" value="10" oninput="calc1()">
        <label id="lbl-num">Number</label>
        <input type="number" id="v1" class="input-box" value="100" oninput="calc1()">
        <div class="res-container"><span class="res-val" id="r1">10.00</span></div>
    </div>

    <div class="calc-section">
        <h3 style="margin:0 0 15px 0; font-size:16px; color:#22c55e;" id="title-2">Percentage Difference</h3>
        <label id="lbl-from">From value</label>
        <input type="number" id="v2a" class="input-box" value="100" oninput="calc2()">
        <label id="lbl-to">To value</label>
        <input type="number" id="v2b" class="input-box" value="120" oninput="calc2()">
        <div class="res-container"><span class="res-val" id="r2">20.00%</span></div>
    </div>
</div>

<div class="seo-content" id="seo-box"></div>

<div class="network-tools">
    <p style="font-size: 12px; color: #475569; margin-bottom: 10px;" id="txt-tools">Other tools:</p>
    <a href="https://smart-converter.github.io/vat-calculator/" class="tool-link">VAT Calculator</a>
    <a href="https://smart-converter.github.io/unit-converter/" class="tool-link">Unit Converter</a>
</div>

<footer>
    <span class="footer-link" onclick="openPol('privacy')" id="link-privacy">Privacy</span>
    <span class="footer-link" onclick="openPol('terms')" id="link-terms">Terms</span>
    <p id="txt-footer" style="color: #475569; font-size: 11px; margin-top: 15px;"></p>
</footer>

<div id="siteModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const translations = {
        en: {
            t1: "What is X% of Y?", t2: "Percentage Difference", perc: "Percentage (%)", num: "Number", from: "From value", to: "To value",
            privacy: "Privacy Policy", terms: "Terms of Use", footer: "© 2026 %CALC ELITE. All rights reserved. Secure and fast calculations.", tools: "Our Elite Tools:",
            privacyText: "<h3>Privacy Policy</h3><p>We do not collect data. All calculations stay in your browser.</p>",
            termsText: "<h3>Terms of Use</h3><p>This tool is for informational purposes only. Accuracy is not guaranteed.</p>",
            seo: `<h2>Pro Percentage Calculator</h2><p>Quickly calculate percentages and differences for business or school.</p>`
        },
        uk: {
            t1: "Розрахунок % від числа", t2: "Відсоткова різниця", perc: "Скільки %", num: "Від числа", from: "Початкове число", to: "Кінцеве число",
            privacy: "Конфіденційність", terms: "Умови", footer: "© 2026 %CALC ELITE. Всі права захищено. Швидкі та безпечні розрахунки.", tools: "Інші інструменти:",
            privacyText: "<h3>Конфіденційність</h3><p>Ми не збираємо ваші дані. Все працює локально.</p>",
            termsText: "<h3>Умови</h3><p>Інструмент для ознайомлення. Ми не несемо відповідальності за помилки.</p>",
            seo: `<h2>Професійний калькулятор відсотків</h2><p>Швидко рахуйте відсотки та різницю онлайн. Ідеально для фінансів.</p>`
        },
        es: {
            t1: "¿Cuánto es X% de Y?", t2: "Diferencia Porcentual", perc: "Porcentaje (%)", num: "Número", from: "De", to: "A",
            privacy: "Privacidad", terms: "Términos", footer: "© 2026 %CALC ELITE. Todos los derechos reservados. Cálculos rápidos y seguros.", tools: "Otras herramientas:",
            privacyText: "<h3>Privacidad</h3><p>No recopilamos datos personales. Los cálculos se realizan localmente.</p>",
            termsText: "<h3>Términos</h3><p>Herramienta informativa solamente. No nos hacemos responsables de errores.</p>",
            seo: `<h2>Calculadora de Porcentajes</h2><p>Calcule porcentajes y diferencias rápidamente para cualquier necesidad.</p>`
        },
        de: {
            t1: "Was ist X% von Y?", t2: "Prozentuale Differenz", perc: "Prozent (%)", num: "Zahl", from: "Von Wert", to: "Zu Wert",
            privacy: "Datenschutz", terms: "AGB", footer: "© 2026 %CALC ELITE. Alle Rechte vorbehalten. Schnelle und sichere Berechnungen.", tools: "Andere Werkzeuge:",
            privacyText: "<h3>Datenschutz</h3><p>Keine Datenspeicherung im Browser. Ihre Privatsphäre ist uns wichtig.</p>",
            termsText: "<h3>AGB</h3><p>Nur zu Informationszwecken. Nutzung auf eigene Gefahr ohne Gewähr.</p>",
            seo: `<h2>Prozentrechner Online</h2><p>Berechnen Sie Prozentsätze und Differenzen schnell und einfach.</p>`
        }
    };

    let curLang = localStorage.getItem('lang_perc_elite') || 'en';

    function changeLang(lang) {
        curLang = lang;
        localStorage.setItem('lang_perc_elite', lang);
        updateUI();
    }

    function updateUI() {
        const l = translations[curLang] || translations['en'];
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if(document.getElementById('btn-' + curLang)) document.getElementById('btn-' + curLang).classList.add('active');

        document.getElementById('title-1').innerText = l.t1;
        document.getElementById('title-2').innerText = l.t2;
        document.getElementById('lbl-perc').innerText = l.perc;
        document.getElementById('lbl-num').innerText = l.num;
        document.getElementById('lbl-from').innerText = l.from;
        document.getElementById('lbl-to').innerText = l.to;
        document.getElementById('seo-box').innerHTML = l.seo;
        document.getElementById('txt-footer').innerText = l.footer;
        document.getElementById('link-privacy').innerText = l.privacy;
        document.getElementById('link-terms').innerText = l.terms;
        document.getElementById('txt-tools').innerText = l.tools;
        calc1(); calc2();
    }

    function calc1() {
        const p = parseFloat(document.getElementById('p1').value) || 0;
        const v = parseFloat(document.getElementById('v1').value) || 0;
        document.getElementById('r1').innerText = (v * (p / 100)).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function calc2() {
        const a = parseFloat(document.getElementById('v2a').value) || 0;
        const b = parseFloat(document.getElementById('v2b').value) || 0;
        if (a === 0) { document.getElementById('r2').innerText = "0.00%"; return; }
        const diff = ((b - a) / a) * 100;
        document.getElementById('r2').innerText = (diff > 0 ? "+" : "") + diff.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + "%";
    }

    function openPol(type) {
        const l = translations[curLang] || translations['en'];
        document.getElementById('modalBody').innerHTML = type === 'privacy' ? l.privacyText : l.termsText; 
        document.getElementById('siteModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('siteModal').style.display = 'none'; }
    window.onclick = function(event) { if (event.target == document.getElementById('siteModal')) closeModal(); }
    updateUI();
</script>
</body>
</html>
