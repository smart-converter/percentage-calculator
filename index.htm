<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO Percentage Calculator</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); line-height: 1.4; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        .header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; gap: 10px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: -0.5px; }
        
        .lang-select { background: #334155; color: white; border: 2px solid var(--accent); padding: 4px 8px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 16px; outline: none; height: 34px; }

        .container { max-width: 800px; margin: 10px auto; padding: 0 15px; box-sizing: border-box; }
        .calc-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .calc-card h3 { margin: 0 0 15px 0; font-size: 20px; color: var(--accent); font-weight: 800; }
        
        .calc-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .input-group { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
        
        .input-box { width: 100px; padding: 12px; border: 2px solid #475569; border-radius: 12px; font-size: 18px; font-weight: 800; background: #0f172a; color: white; outline: none; box-sizing: border-box; }
        .res-box { min-width: 120px; padding: 12px; border: 2px solid var(--success); border-radius: 12px; font-size: 20px; font-weight: 900; background: rgba(34, 197, 94, 0.1); color: var(--success); text-align: center; }
        
        .seo-text { padding: 25px; font-size: 15px; color: #cbd5e1; background: var(--card-bg); border-radius: 20px; margin-top: 20px; border: 1px solid #334155; }
        .seo-text h2 { color: var(--accent); font-size: 24px; font-weight: 900; margin-top: 0; }

        footer { text-align: center; padding: 40px 20px; background: #0f172a; border-top: 1px solid #334155; margin-top: 30px; }
        .footer-link { color: var(--accent); cursor: pointer; text-decoration: none; margin: 0 10px; font-weight: 700; font-size: 14px; }

        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 30px auto; padding: 30px; width: 85%; max-width: 650px; border-radius: 25px; border: 2px solid var(--accent); position: relative; color: #e2e8f0; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 40px; cursor: pointer; color: #64748b; font-weight: 300; }

        @media (max-width: 600px) {
            .calc-row { flex-direction: column; align-items: stretch; }
            .input-box, .res-box { width: 100%; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">PRO Percentage</h1>
    <select class="lang-select" onchange="setLang(this.value)" id="langPicker">
        <option value="en">ENGLISH</option>
        <option value="uk">УКРАЇНСЬКА</option>
        <option value="es">ESPAÑOL</option>
        <option value="de">DEUTSCH</option>
    </select>
</div>

<div class="container">
    <div style="height: 60px; background: rgba(255,255,255,0.03); border: 1px dashed #444; border-radius: 10px; margin: 15px 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666;">AD SPACE</div>

    <div class="calc-card">
        <h3 id="h3-t1">What is X% of Y?</h3>
        <div class="calc-row">
            <div class="input-group"><span id="t1-1">Calculate</span> <input type="number" id="t1-p" class="input-box" oninput="calc1()" placeholder="%"> <span id="t1-2">% of</span></div>
            <div class="input-group"><input type="number" id="t1-v" class="input-box" oninput="calc1()" placeholder="Val"> <span>=</span></div>
            <input type="text" id="t1-res" class="res-box" readonly placeholder="...">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t2">X is what % of Y?</h3>
        <div class="calc-row">
            <div class="input-group"><input type="number" id="t2-v1" class="input-box" oninput="calc2()"> <span id="t2-1">is what % of</span></div>
            <div class="input-group"><input type="number" id="t2-v2" class="input-box" oninput="calc2()"> <span>=</span></div>
            <input type="text" id="t2-res" class="res-box" readonly>
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t3">Percentage change</h3>
        <div class="calc-row">
            <div class="input-group"><span id="t3-1">From</span> <input type="number" id="t3-v1" class="input-box" oninput="calc3()"> <span id="t3-2">to</span></div>
            <div class="input-group"><input type="number" id="t3-v2" class="input-box" oninput="calc3()"> <span id="t3-3">is change:</span></div>
            <input type="text" id="t3-res" class="res-box" readonly>
        </div>
    </div>

    <div class="seo-text" id="seo-content"></div>
</div>

<footer>
    <p id="footer-copy">© 2025 PRO Percentage</p>
    <div style="margin-top:20px;">
        <span class="footer-link" onclick="openModal('privacy')" id="link-priv">Privacy Policy</span>
        <span class="footer-link" onclick="openModal('terms')" id="link-terms">Terms of Use</span>
    </div>
</footer>

<div id="modal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
const data = {
    en: {
        title: "PRO Percentage", h1: "Find percentage of a value", h2: "Number to percentage ratio", h3: "Percentage increase/decrease",
        t1_1: "What is", t1_2: "% of", t2_1: "is what % of", t3_1: "From", t3_2: "to", t3_3: "result:",
        seo: `<h2>Advanced Percentage Calculator</h2><p>Our professional <strong>Percentage Calculator</strong> provides fast results for any mathematical task.</p>`,
        privText: `<h2>Privacy Policy</h2><p>We do not collect personal data. We use cookies for Google AdSense. Your connection is secured with HTTPS.</p>`,
        termsText: `<h2>Terms of Service</h2><p>Results are for informational purposes. We are not responsible for financial decisions.</p>`
    },
    uk: {
        title: "PRO % Калькулятор", h1: "Знайти відсоток від числа", h2: "Відсоткове співвідношення", h3: "Розрахунок зростання/падіння",
        t1_1: "Скільки буде", t1_2: "% від", t2_1: "це який % від", t3_1: "З", t3_2: "до", t3_3: "зміна:",
        seo: `<h2>Найкращий калькулятор відсотків онлайн</h2><p>Швидкі та точні розрахунки ПДВ, знижок та маржі.</p>`,
        privText: `<h2>Політика конфіденційності</h2><p>Сайт не збирає персональні дані. Використовуються куки Google AdSense для реклами.</p>`,
        termsText: `<h2>Умови використання</h2><p>Результати обчислень мають довідковий характер. Заборонено копіювання коду.</p>`
    },
    es: {
        title: "PRO Porcentaje", h1: "Calcular porcentaje de un valor", h2: "Relación numérica a %", h3: "Aumento o disminución en %",
        t1_1: "Cuánto es el", t1_2: "% de", t2_1: "es qué % de", t3_1: "De", t3_2: "a", t3_3: "es:",
        seo: `<h2>Calculadora de Porcentajes</h2><p>Resuelva problemas matemáticos en segundos con alta precisión.</p>`,
        privText: `<h2>Privacidad</h2><p>No recopilamos información personal. Utilizamos cookies de Google para publicidad.</p>`,
        termsText: `<h2>Términos</h2><p>Los resultados son informativos. No nos hacemos responsables de pérdidas financieras.</p>`
    },
    de: {
        title: "PRO Prozentrechner", h1: "Prozentwert einer Zahl finden", h2: "Verhältnis in Prozent", h3: "Steigerung oder Senkung %",
        t1_1: "Was sind", t1_2: "% von", t2_1: "ist wie viel % von", t3_1: "Von", t3_2: "auf", t3_3: "ist:",
        seo: `<h2>Premium Prozentrechner</h2><p>Berechnen Sie Rabatte, Zinsen und Steuern blitzschnell.</p>`,
        privText: `<h2>Datenschutz</h2><p>Wir sammeln keine personenbezogenen Daten. Cookies werden nur für Werbung verwendet.</p>`,
        termsText: `<h2>Bedingungen</h2><p>Alle Berechnungen ohne Gewähr. Keine Haftung für Rechenfehler.</p>`
    }
};

let cur = localStorage.getItem('lang_v5') || 'en';

function setLang(lang) {
    cur = lang;
    localStorage.setItem('lang_v5', lang);
    const l = data[lang];
    document.getElementById('main-title').innerText = l.title;
    document.getElementById('h3-t1').innerText = l.h1;
    document.getElementById('h3-t2').innerText = l.h2;
    document.getElementById('h3-t3').innerText = l.h3;
    document.getElementById('t1-1').innerText = l.t1_1;
    document.getElementById('t1-2').innerText = l.t1_2;
    document.getElementById('t2-1').innerText = l.t2_1;
    document.getElementById('t3-1').innerText = l.t3_1;
    document.getElementById('t3-2').innerText = l.t3_2;
    document.getElementById('t3-3').innerText = l.t3_3;
    document.getElementById('seo-content').innerHTML = l.seo;
    document.getElementById('langPicker').value = lang;
}

function calc1() {
    const p = parseFloat(document.getElementById('t1-p').value), v = parseFloat(document.getElementById('t1-v').value);
    const res = document.getElementById('t1-res');
    if(!isNaN(p) && !isNaN(v)) res.value = ((p / 100) * v).toFixed(2); else res.value = "";
}

function calc2() {
    const v1 = parseFloat(document.getElementById('t2-v1').value), v2 = parseFloat(document.getElementById('t2-v2').value);
    const res = document.getElementById('t2-res');
    if(!isNaN(v1) && !isNaN(v2) && v2 !== 0) res.value = ((v1 / v2) * 100).toFixed(2) + "%"; else res.value = "";
}

function calc3() {
    const v1 = parseFloat(document.getElementById('t3-v1').value), v2 = parseFloat(document.getElementById('t3-v2').value);
    const res = document.getElementById('t3-res');
    if(!isNaN(v1) && !isNaN(v2) && v1 !== 0) {
        const diff = ((v2 - v1) / v1) * 100;
        res.value = (diff > 0 ? "+" : "") + diff.toFixed(2) + "%";
        res.style.color = diff >= 0 ? "#22c55e" : "#ef4444";
    } else res.value = "";
}

function openModal(type) {
    const l = data[cur];
    document.getElementById('modal-body').innerHTML = type === 'privacy' ? l.privText : l.termsText;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
setLang(cur);
</script>
</body>
</html>
