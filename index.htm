<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO Percentage Calculator</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

        /* Охайна шапка */
        .header { background: #1e293b; padding: 15px 20px; border-bottom: 1px solid #334155; text-align: center; }
        .header h1 { margin: 0 0 15px 0; font-size: 22px; font-weight: 900; color: var(--accent); text-transform: uppercase; }

        /* Стильні кнопки перемикання мов замість випадаючого списку */
        .lang-switcher { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
        .lang-btn { background: #334155; color: white; border: 1px solid var(--accent); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .lang-btn.active { background: var(--accent); color: var(--bg); }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 15px; }

        /* Картки з автоматичною висотою */
        .calc-card { background: var(--card-bg); border-radius: 18px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .calc-card h3 { margin: 0 0 15px 0; font-size: 19px; color: var(--text); font-weight: 800; line-height: 1.2; }

        /* Вертикальна структура для мобільних (щоб нічого не з'їжджало) */
        .calc-box { display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 15px; }
        
        .input-box { flex: 1; padding: 14px; border: 2px solid #475569; border-radius: 12px; font-size: 18px; font-weight: 800; background: #0f172a; color: white; outline: none; width: 100%; box-sizing: border-box; }
        .input-box:focus { border-color: var(--accent); }
        
        .res-box { width: 100%; padding: 14px; border: 2px solid var(--success); border-radius: 12px; font-size: 20px; font-weight: 900; background: rgba(34, 197, 94, 0.1); color: var(--success); text-align: center; box-sizing: border-box; margin-top: 5px; }

        .seo-text { padding: 20px; font-size: 15px; color: #cbd5e1; line-height: 1.5; }
        .seo-text h2 { color: var(--accent); font-size: 22px; }

        /* Футер чітко по центру */
        footer { padding: 40px 20px; border-top: 1px solid #334155; text-align: center; }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .footer-link { color: var(--accent); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }

        /* Модальне вікно */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 30px; width: 85%; max-width: 500px; border-radius: 20px; position: relative; max-height: 70vh; overflow-y: auto; text-align: left; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 35px; color: #64748b; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">PRO % CALC</h1>
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
        <button class="lang-btn" onclick="setLang('uk')" id="btn-uk">UA</button>
        <button class="lang-btn" onclick="setLang('es')" id="btn-es">ES</button>
        <button class="lang-btn" onclick="setLang('de')" id="btn-de">DE</button>
    </div>
</div>

<div class="container">
    <div class="calc-card">
        <h3 id="h3-t1">Find Percentage</h3>
        <div class="calc-box">
            <div class="input-row"><span id="t1-1">What is</span> <input type="number" id="t1-p" class="input-box" oninput="calc1()" placeholder="%"> <span id="t1-2">% of</span></div>
            <input type="number" id="t1-v" class="input-box" oninput="calc1()" placeholder="Value">
            <input type="text" id="t1-res" class="res-box" readonly placeholder="Result">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t2">Ratio Analysis</h3>
        <div class="calc-box">
            <input type="number" id="t2-v1" class="input-box" oninput="calc2()">
            <div class="input-row"><span id="t2-1">is what % of</span> <input type="number" id="t2-v2" class="input-box" oninput="calc2()"></div>
            <input type="text" id="t2-res" class="res-box" readonly placeholder="Result %">
        </div>
    </div>

    <div class="seo-text" id="seo-content"></div>
</div>

<footer>
    <div id="footer-copy">© 2025 PRO Percentage</div>
    <div class="footer-links">
        <span class="footer-link" onclick="openModal('privacy')" id="link-priv">Privacy</span>
        <span class="footer-link" onclick="openModal('terms')" id="link-terms">Terms</span>
    </div>
</footer>

<div id="modal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
const data = {
    en: {
        title: "PRO % CALC", h1: "Find Percentage", h2: "Number Ratio",
        t1_1: "What is", t1_2: "% of", t2_1: "is what % of",
        seo: "<h2>Fast calculations</h2><p>Accurate percentage tools for business and finance.</p>",
        priv: "<h2>Privacy</h2><p>We don't collect data.</p>", terms: "<h2>Terms</h2><p>Informational use only.</p>"
    },
    uk: {
        title: "PRO % КАЛЬКУЛЯТОР", h1: "Знайти % від числа", h2: "Відсоткове співвідношення",
        t1_1: "Скільки", t1_2: "% від", t2_1: "це який % від",
        seo: "<h2>Швидкі розрахунки</h2><p>Точний інструмент для бізнесу та навчання.</p>",
        priv: "<h2>Приватність</h2><p>Ми не збираємо дані.</p>", terms: "<h2>Умови</h2><p>Тільки для ознайомлення.</p>"
    }
};

let cur = localStorage.getItem('lang_v7') || 'uk';

function setLang(lang) {
    cur = lang;
    localStorage.setItem('lang_v7', lang);
    const l = data[lang] || data['en'];
    document.getElementById('main-title').innerText = l.title;
    document.getElementById('h3-t1').innerText = l.h1;
    document.getElementById('h3-t2').innerText = l.h2;
    document.getElementById('t1-1').innerText = l.t1_1;
    document.getElementById('t1-2').innerText = l.t1_2;
    document.getElementById('t2-1').innerText = l.t2_1;
    document.getElementById('seo-content').innerHTML = l.seo;
    
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById('btn-' + lang);
    if(activeBtn) activeBtn.classList.add('active');
}

function calc1() {
    const p = parseFloat(document.getElementById('t1-p').value), v = parseFloat(document.getElementById('t1-v').value);
    const res = document.getElementById('t1-res');
    res.value = (!isNaN(p) && !isNaN(v)) ? ((p / 100) * v).toFixed(2) : "";
}

function calc2() {
    const v1 = parseFloat(document.getElementById('t2-v1').value), v2 = parseFloat(document.getElementById('t2-v2').value);
    const res = document.getElementById('t2-res');
    res.value = (!isNaN(v1) && !isNaN(v2) && v2 !== 0) ? ((v1 / v2) * 100).toFixed(2) + "%" : "";
}

function openModal(type) {
    const l = data[cur] || data['en'];
    document.getElementById('modal-body').innerHTML = type === 'privacy' ? l.priv : l.terms;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
setLang(cur);
</script>
</body>
</html>
