<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Percentage Calculator Pro</title>
    <meta name="description" content="Calculate percentages, difference, and growth instantly.">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: #334155;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; background-color: var(--bg-dark); color: var(--text-light); 
        }
        
        .top-header { background-color: #166534; height: 50px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .top-header h1 { margin: 0; font-size: 18px; font-weight: 900; color: white; }
        
        .lang-switcher { background: var(--bg-dark); border: 1.5px solid white; color: white; padding: 3px 6px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box; }
        
        /* ТАБИ ЯК У UNIT CONVERTER */
        .tabs-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; 
            background-color: #14532d; border: 1px solid #14532d; 
            margin: 10px 0; border-radius: 8px; overflow: hidden; height: 42px;
        }
        .tab { 
            background: #166534; color: #fff; border: none; cursor: pointer; 
            font-size: 10px; font-weight: 800; text-transform: uppercase; 
            display: flex; align-items: center; justify-content: center;
        }
        .tab.active { background: #fff; color: #166534; }
        
        .converter-box { border: 1px solid var(--border-color); padding: 20px; background: var(--card-bg); border-radius: 12px; }
        .row { display: flex; align-items: center; margin-bottom: 12px; }
        .row label { width: 110px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .input-field { 
            flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; 
            font-size: 17px; font-weight: 800; background: #fff; color: #000; outline: none; 
        }
        .res-field { background: #f0fdf4 !important; color: #166534 !important; border: 2px solid #22c55e !important; }

        /* СІТКА ІНСТРУМЕНТІВ (ВИПРАВЛЕНО) */
        .tools-network { padding: 20px 0; text-align: center; }
        .tools-network h4 { margin: 0 0 12px 0; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        
        .tools-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            max-width: 440px; /* Обмеження ширини щоб не розтягувались */
            margin: 0 auto; 
        }
        
        .tool-link-btn { 
            padding: 8px 4px; 
            border: 1px solid var(--accent-green); 
            color: var(--accent-green); 
            text-decoration: none; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 44px; /* Фіксована висота як у UNIT */
            box-sizing: border-box;
            background: rgba(34, 197, 94, 0.05);
        }
        
        /* Остання кнопка по центру якщо їх непарна кількість */
        .tool-link-btn:last-child:nth-child(odd) { 
            grid-column: 1 / span 2; 
            width: calc(50% - 4px); 
            justify-self: center; 
        }

        /* ФУТЕР (КОМПАКТНИЙ ТА НЕ ВИЙТЯГНУТИЙ) */
        footer { border-top: 1px solid var(--border-color); padding: 25px 10px; text-align: center; }
        
        .footer-info-block { 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 10px; 
            padding: 15px; 
            margin: 0 auto 20px auto; 
            background: rgba(255, 255, 255, 0.02); 
            text-align: left; 
            max-width: 480px; /* Обмеження ширини тексту */
            line-height: 1.5; 
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .footer-link { color: var(--accent-green); text-decoration: none; font-weight: 700; margin: 0 10px; font-size: 12px; cursor: pointer; }
        
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card-bg); margin: 15% auto; padding: 20px; width: 85%; max-width: 450px; border-radius: 12px; position: relative; font-size: 14px; }
        .close-btn { position: absolute; right: 10px; top: 5px; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>

<header class="top-header">
    <h1>SmartPercentage.io</h1>
    <select class="lang-switcher" onchange="changeLang(this.value)" id="langSelect">
        <option value="en">EN</option>
        <option value="uk">UA</option>
    </select>
</header>

<main class="container">
    <div id="tabs" class="tabs-grid"></div>
    
    <section class="converter-box">
        <div id="calc-ui"></div>
        <div class="row" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <label id="lbl-result">Result:</label>
            <input type="text" id="valOut" class="input-field res-field" readonly>
        </div>
    </section>

    <div class="tools-network">
        <h4 id="txt-other-tools">Other Elite Tools</h4>
        <div class="tools-grid">
            <a href="https://smart-converter.github.io/unit-converter/" class="tool-link-btn">Unit Converter</a>
            <a href="https://smart-converter.github.io/currency-converter/" class="tool-link-btn">Currency</a>
            <a href="https://smart-converter.github.io/vat-calculator/" class="tool-link-btn">VAT Calc</a>
            <a href="https://smart-converter.github.io/loan-calculator/" class="tool-link-btn">Loans</a>
            <a href="https://smart-converter.github.io/discount-calculator/" class="tool-link-btn">Discounts</a>
            <a href="https://smart-converter.github.io/tip-calculator/" class="tool-link-btn">Tips</a>
            <a href="https://smart-converter.github.io/bmi-calculator/" class="tool-link-btn">BMI Calc</a>
        </div>
    </div>
</main>

<footer>
    <div class="footer-info-block" id="footer-full-text"></div>
    <p style="font-size: 11px; color: #64748b;">© 2026 SmartPercentage.io</p>
    <div>
        <span class="footer-link" onclick="openPol('privacy')" id="link-privacy">Privacy</span>
        <span class="footer-link" onclick="openPol('terms')" id="link-terms">Terms</span>
    </div>
</footer>

<div id="siteModal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content"><span class="close-btn" onclick="closeModal()">×</span><div id="modalBody"></div></div>
</div>

<script>
    const translations = {
        en: {
            res: "Result:", other: "Other Elite Tools", cats: ["Basic %", "Difference", "Increase"],
            l1: "Percent %", l2: "Of Number", l3: "Initial", l4: "Final", l5: "Value",
            footer: "SmartPercentage.io provides high-precision percentage calculations for business and education. Our tools ensure 100% accuracy for margins, growth, and daily math tasks.",
            privacy: "Privacy Policy", terms: "Terms of Use",
            privText: "<h2>Privacy</h2><p>All calculations are local. We don't store your data.</p>",
            termsText: "<h2>Terms</h2><p>For informational use only.</p>"
        },
        uk: {
            res: "Результат:", other: "Інші професійні інструменти", cats: ["Базовий %", "Різниця", "Приріст"],
            l1: "Відсоток %", l2: "Від числа", l3: "Початкове", l4: "Кінцеве", l5: "Значення",
            footer: "SmartPercentage.io надає високоточні розрахунки відсотків для бізнесу та навчання. Наші інструменти гарантують 100% точність для розрахунку маржі, приросту та щоденних завдань.",
            privacy: "Конфіденційність", terms: "Умови",
            privText: "<h2>Конфіденційність</h2><p>Розрахунки відбуваються локально. Ми не зберігаємо ваші дані.</p>",
            termsText: "<h2>Умови</h2><p>Тільки для інформаційних цілей.</p>"
        }
    };

    let curLang = localStorage.getItem('lang_perc') || 'en';
    let currentTab = 0;

    function changeLang(lang) { curLang = lang; localStorage.setItem('lang_perc', lang); updateUI(); }

    function updateUI() {
        const l = translations[curLang] || translations.en;
        document.getElementById('langSelect').value = curLang;
        document.getElementById('lbl-result').innerText = l.res;
        document.getElementById('txt-other-tools').innerText = l.other;
        document.getElementById('footer-full-text').innerText = l.footer;
        document.getElementById('link-privacy').innerText = l.privacy;
        document.getElementById('link-terms').innerText = l.terms;
        initTabs();
    }

    function initTabs() {
        const t = document.getElementById('tabs'); t.innerHTML = '';
        const l = translations[curLang] || translations.en;
        l.cats.forEach((cat, i) => {
            const b = document.createElement('button');
            b.className = `tab ${i === currentTab ? 'active' : ''}`;
            b.innerText = cat;
            b.onclick = () => { currentTab = i; initTabs(); renderCalc(); };
            t.appendChild(b);
        });
        renderCalc();
    }

    function renderCalc() {
        const l = translations[curLang] || translations.en;
        const container = document.getElementById('calc-ui');
        let html = '';
        if (currentTab === 0) {
            html = `<div class="row"><label>${l.l1}:</label><input type="number" id="v1" class="input-field" value="10" oninput="calc()"></div>
                    <div class="row"><label>${l.l2}:</label><input type="number" id="v2" class="input-field" value="100" oninput="calc()"></div>`;
        } else if (currentTab === 1) {
            html = `<div class="row"><label>${l.l3}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label>${l.l4}:</label><input type="number" id="v2" class="input-field" value="125" oninput="calc()"></div>`;
        } else {
            html = `<div class="row"><label>${l.l5}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label>${l.l1} (+):</label><input type="number" id="v2" class="input-field" value="20" oninput="calc()"></div>`;
        }
        container.innerHTML = html;
        calc();
    }

    function calc() {
        const a = parseFloat(document.getElementById('v1').value) || 0;
        const b = parseFloat(document.getElementById('v2').value) || 0;
        const out = document.getElementById('valOut');
        let res = 0;
        if (currentTab === 0) res = a * (b / 100);
        else if (currentTab === 1) res = a !== 0 ? ((b - a) / a) * 100 : 0;
        else res = a + (a * (b / 100));
        out.value = currentTab === 1 ? res.toFixed(2) + "%" : res.toLocaleString(undefined, {maximumFractionDigits: 2});
    }

    function openPol(type) {
        const l = translations[curLang] || translations.en;
        document.getElementById('modalBody').innerHTML = type === 'privacy' ? l.privText : l.termsText;
        document.getElementById('siteModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('siteModal').style.display = 'none'; }

    updateUI();
</script>
</body>
</html>
