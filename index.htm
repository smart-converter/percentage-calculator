<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRO Percentage Calculator</title>
    <style>
        :root { 
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; 
            --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }

        /* ШАПКА */
        .header { background: #1e293b; padding: 20px; border-bottom: 1px solid #334155; text-align: center; }
        .header h1 { margin: 0 0 15px 0; font-size: 24px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: -1px; }

        /* ПЕРЕМИКАЧ МОВ (Apple Style) */
        .lang-switcher { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .lang-btn { background: #334155; color: white; border: 2px solid var(--accent); padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .lang-btn.active { background: var(--accent); color: var(--bg); }

        .container { max-width: 700px; margin: 0 auto; padding: 20px 15px; }

        /* КАРТКИ */
        .calc-card { background: var(--card-bg); border-radius: 22px; padding: 25px; margin-bottom: 25px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .calc-card h3 { margin: 0 0 20px 0; font-size: 22px; color: var(--accent); font-weight: 900; line-height: 1.2; border-left: 4px solid var(--accent); padding-left: 15px; }

        .calc-box { display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; font-size: 17px; }
        
        .input-box { flex: 1; padding: 15px; border: 2px solid #475569; border-radius: 14px; font-size: 19px; font-weight: 800; background: #0f172a; color: white; outline: none; width: 100%; box-sizing: border-box; }
        .input-box:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); }
        
        .res-box { width: 100%; padding: 16px; border: 2px solid var(--success); border-radius: 14px; font-size: 22px; font-weight: 900; background: rgba(34, 197, 94, 0.1); color: var(--success); text-align: center; box-sizing: border-box; margin-top: 5px; }

        /* ВЕЛИКИЙ ТЕКСТ */
        .seo-text { padding: 30px 15px; font-size: 16px; color: #cbd5e1; line-height: 1.7; border-top: 1px solid #334155; }
        .seo-text h2 { color: var(--accent); font-size: 26px; font-weight: 900; margin-bottom: 15px; }
        .seo-text p { margin-bottom: 15px; }

        /* ВЕЛИКИЙ ФУТЕР */
        footer { padding: 50px 20px; border-top: 1px solid #334155; text-align: center; background: #0f172a; }
        #footer-copy { font-weight: 900; color: #94a3b8; font-size: 18px; margin-bottom: 25px; }
        .footer-links { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .footer-link { color: var(--accent); font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none; border-bottom: 1px solid transparent; }
        .footer-link:hover { border-bottom-color: var(--accent); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 35px; width: 85%; max-width: 600px; border-radius: 25px; border: 2px solid var(--accent); position: relative; color: #e2e8f0; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 40px; color: #64748b; cursor: pointer; }

        @media (max-width: 600px) {
            .header h1 { font-size: 20px; }
            .lang-btn { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">PRO % CALCULATOR</h1>
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">ENGLISH</button>
        <button class="lang-btn" onclick="setLang('uk')" id="btn-uk">УКРАЇНСЬКА</button>
        <button class="lang-btn" onclick="setLang('es')" id="btn-es">ESPAÑOL</button>
        <button class="lang-btn" onclick="setLang('de')" id="btn-de">DEUTSCH</button>
    </div>
</div>

<div class="container">
    <div class="calc-card">
        <h3 id="h3-t1">Find Percentage Value</h3>
        <div class="calc-box">
            <div class="input-row"><span id="t1-1">What is</span> <input type="number" id="t1-p" class="input-box" oninput="calc1()" placeholder="%"> <span id="t1-2">% of</span></div>
            <input type="number" id="t1-v" class="input-box" oninput="calc1()" placeholder="Number">
            <input type="text" id="t1-res" class="res-box" readonly placeholder="Result">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t2">Ratio Analysis</h3>
        <div class="calc-box">
            <input type="number" id="t2-v1" class="input-box" oninput="calc2()" placeholder="Number 1">
            <div class="input-row"><span id="t2-1">is what % of</span> <input type="number" id="t2-v2" class="input-box" oninput="calc2()" placeholder="Number 2"></div>
            <input type="text" id="t2-res" class="res-box" readonly placeholder="Result %">
        </div>
    </div>

    <div class="calc-card">
        <h3 id="h3-t3">Percentage Change</h3>
        <div class="calc-box">
            <div class="input-row"><span id="t3-1">From</span> <input type="number" id="t3-v1" class="input-box" oninput="calc3()"> <span id="t3-2">to</span></div>
            <input type="number" id="t3-v2" class="input-box" oninput="calc3()">
            <input type="text" id="t3-res" class="res-box" readonly placeholder="Difference %">
        </div>
    </div>

    <div class="seo-text" id="seo-content"></div>
</div>

<footer>
    <div id="footer-copy">© 2025 PRO Percentage Calculator</div>
    <div class="footer-links">
        <span class="footer-link" onclick="openModal('privacy')" id="link-priv">Privacy Policy</span>
        <span class="footer-link" onclick="openModal('terms')" id="link-terms">Terms of Use</span>
    </div>
</footer>

<div id="modal" class="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
const data = {
    en: {
        title: "PRO % CALCULATOR", h1: "Find Percentage Value", h2: "Number Ratio to %", h3: "Percentage Change Rate",
        t1_1: "What is", t1_2: "% of", t2_1: "is what % of", t3_1: "From", t3_2: "to",
        seo: `<h2>Advanced Percentage Solutions</h2><p>Our professional <strong>Percentage Calculator</strong> is optimized for business and personal finance. Calculate sales tax, investment ROI, and discounts with high-speed algorithms.</p><h2>Accuracy in Every Calculation</h2><p>Used by students and financial analysts worldwide, this tool ensures your calculations are 100% correct every time.</p>`,
        priv: `<h2>Privacy Policy</h2><p>We do not collect personal data. Cookies are used only for advertisement purposes via Google AdSense.</p>`,
        terms: `<h2>Terms</h2><p>Results are for informational purposes. We are not liable for financial decisions based on our tool.</p>`
    },
    uk: {
        title: "PRO % КАЛЬКУЛЯТОР", h1: "Розрахунок % від числа", h2: "Відсоткове співвідношення", h3: "Динаміка зміни (різниця)",
        t1_1: "Скільки", t1_2: "% від", t2_1: "це який % від", t3_1: "З", t3_2: "до",
        seo: `<h2>Професійний розрахунок відсотків</h2><p>Наш інструмент створений для тих, кому потрібна швидкість і точність. Рахуйте ПДВ, маржу або знижки за лічені секунди без зайвих зусиль.</p><h2>Чому обирають нас?</h2><p>Ми забезпечуємо миттєві результати та підтримуємо три найпопулярніші режими розрахунків для навчання, торгівлі та бізнесу.</p>`,
        priv: `<h2>Приватність</h2><p>Ми дбаємо про вашу безпеку. Сайт не збирає імена чи пошту. Файли cookie використовуються лише для показу реклами Google.</p>`,
        terms: `<h2>Умови</h2><p>Всі розрахунки мають довідковий характер. Використовуючи сайт, ви погоджуєтеся з відповідальністю за свої фінансові рішення.</p>`
    },
    es: {
        title: "PRO % CALCULADORA", h1: "Calcular Porcentaje", h2: "Relación de Números", h3: "Tasa de Cambio %",
        t1_1: "Qué es el", t1_2: "% de", t2_1: "es qué % de", t3_1: "De", t3_2: "a",
        seo: `<h2>Calculadora de Porcentajes Elite</h2><p>Optimice sus cálculos financieros con nuestra herramienta de alta precisión. Ideal para negocios y estudiantes.</p>`,
        priv: `<h2>Privacidad</h2><p>No recopilamos información personal.</p>`,
        terms: `<h2>Términos</h2><p>Los resultados son informativos.</p>`
    },
    de: {
        title: "PRO % RECHNER", h1: "Prozentwert finden", h2: "Verhältnis in %", h3: "Preisänderung %",
        t1_1: "Was sind", t1_2: "% von", t2_1: "ist wie viel % von", t3_1: "Von", t3_2: "auf",
        seo: `<h2>Premium Prozentrechner Online</h2><p>Präzise Ergebnisse für Business und Alltag. Berechnen Sie Steuern und Rabatte sofort.</p>`,
        priv: `<h2>Datenschutz</h2><p>Wir sammeln keine personenbezogenen Daten.</p>`,
        terms: `<h2>Bedingungen</h2><p>Alle Berechnungen ohne Gewähr.</p>`
    }
};

let cur = localStorage.getItem('lang_final_v8') || 'uk';

function setLang(lang) {
    cur = lang;
    localStorage.setItem('lang_final_v8', lang);
    const l = data[lang] || data['en'];
    document.getElementById('main-title').innerText = l.title;
    document.getElementById('h3-t1').innerText = l.h1;
    document.getElementById('h3-t2').innerText = l.h2;
    document.getElementById('h3-t3').innerText = l.h3;
    document.getElementById('t1-1').innerText = l.t1_1;
    document.getElementById('t1-2').innerText = l.t1_2;
    document.getElementById('t2-1').innerText = l.t2_1;
    document.getElementById('t3-1').innerText = l.t3_1;
    document.getElementById('t3-2').innerText = l.t3_2;
    document.getElementById('seo-content').innerHTML = l.seo;
    
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
}

function calc1() {
    const p = parseFloat(document.getElementById('t1-p').value), v = parseFloat(document.getElementById('t1-v').value);
    const res = document.getElementById('t1-res');
    res.value = (!isNaN(p) && !isNaN(v)) ? ((p / 100) * v).toFixed(2) : "";
}

function calc2() {
    const v1 = parseFloat(document.getElementById('t2-v1').value), v2 = parseFloat(document.getElementById('t2-v2').value);
    const res = document.getElementById('t2-res');
    res.value = (!isNaN(v1) && !isNaN(v2) && v2 !== 0) ? ((v1 / v2) * 100).toFixed(2) + "%" : "";
}

function calc3() {
    const v1 = parseFloat(document.getElementById('t3-v1').value), v2 = parseFloat(document.getElementById('t3-v2').value);
    const res = document.getElementById('t3-res');
    if(!isNaN(v1) && !isNaN(v2) && v1 !== 0) {
        const diff = ((v2 - v1) / v1) * 100;
        res.value = (diff > 0 ? "+" : "") + diff.toFixed(2) + "%";
        res.style.color = diff >= 0 ? "#22c55e" : "#ef4444";
    } else res.value = "";
}

function openModal(type) {
    const l = data[cur] || data['en'];
    document.getElementById('modal-body').innerHTML = type === 'privacy' ? l.priv : l.terms;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
setLang(cur);
</script>
</body>
</html>
