<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator Pro - Fast & Accurate</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-light); -webkit-font-smoothing: antialiased; }
        
        .top-header { background-color: #166534; padding: 0 15px; height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .top-header h1 { margin: 0; font-size: 18px; font-weight: 900; color: white; }
        
        .lang-switcher-container { display: flex; align-items: center; gap: 8px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

        .lang-switcher { 
            background: transparent; border: 1px solid white; color: white; 
            padding: 5px 10px; border-radius: 6px; font-size: 15px; 
            cursor: pointer; font-weight: 700; outline: none;
        }
        .lang-switcher option { color: #333; background: #fff; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box; }
        
        .tabs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background-color: #14532d; border: 1px solid #14532d; margin: 10px 0; border-radius: 8px; overflow: hidden; }
        .tab { background: #166534; color: #fff; height: 48px; text-align: center; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: center; border: none; width: 100%; }
        .tab.active { background: #fff; color: #166534; }
        
        .ad-space { background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border-color); margin: 10px 0; text-align: center; color: var(--text-muted); font-size: 10px; height: 90px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        
        .converter-box { border: 1px solid var(--border-color); padding: 20px; background: var(--card-bg); border-radius: 12px; }
        .row { display: flex; align-items: center; margin-bottom: 15px; }
        .row label { width: 120px; font-size: 14px; color: var(--text-muted); font-weight: 600; }
        
        .input-field { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 18px; font-weight: 700; background: #0f172a; color: #fff; outline: none; width: 100%; box-sizing: border-box; }
        .res-field { color: var(--accent-green) !important; border-color: var(--accent-green) !important; background: rgba(34, 197, 94, 0.05) !important; }

        .seo-content { padding: 15px 5px; line-height: 1.6; font-size: 14px; color: var(--text-muted); }
        .seo-content h2 { color: var(--accent-green); font-size: 18px; margin: 20px 0 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; font-weight: 800; }

        .tools-network { padding: 20px 0; text-align: center; border-top: 1px solid var(--border-color); margin-top: 10px; }
        .tools-network h4 { margin: 0 0 15px 0; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 400px; margin: 0 auto; }
        .tool-link-btn { padding: 10px 5px; border: 1px solid var(--accent-green); color: var(--accent-green); text-decoration: none; border-radius: 8px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; height: 44px; box-sizing: border-box; }
        .tool-link-btn:last-child:nth-child(odd) { grid-column: 1 / span 2; justify-self: center; width: calc(50% - 4px); }

        footer { border-top: 1px solid var(--border-color); padding: 30px 15px; text-align: center; }
        .footer-info-block { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin: 0 auto 20px auto; background: rgba(255, 255, 255, 0.02); text-align: left; max-width: 500px; font-size: 13px; line-height: 1.6; color: var(--text-muted); }
        .footer-link { background: none; border: none; color: var(--accent-green); cursor: pointer; padding: 0 10px; font-weight: 700; font-size: 13px; font-family: inherit; }
        
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; }
        .modal-content { 
            background: var(--card-bg); margin: 15% auto; padding: 35px 20px 20px; 
            width: 88%; max-width: 500px; border-radius: 12px; position: relative; 
            border: 1px solid var(--border-color); color: white; line-height: 1.6; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .close-btn { 
            position: absolute; right: 5px; top: 5px; 
            font-size: 40px; font-weight: 300; line-height: 1;
            cursor: pointer; color: var(--text-muted); 
            padding: 10px 20px; display: block; background: none; border: none;
        }
    </style>
</head>
<body>

<header class="top-header">
    <h1>SmartPercentage.io</h1>
    <div class="lang-switcher-container">
        <label for="langSelect" class="sr-only">Choose Language</label>
        <select class="lang-switcher" onchange="changeLang(this.value)" id="langSelect">
            <option value="en">English</option>
            <option value="uk">Українська</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
        </select>
    </div>
</header>

<main class="container">
    <nav id="tabs" class="tabs-grid" aria-label="Calculator modes"></nav>
    <div class="ad-space">ADVERTISEMENT</div>
    
    <div class="converter-box">
        <div id="calc-ui"></div>
        <div class="row" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <label for="valOut" id="lbl-result">Result:</label>
            <input type="text" id="valOut" class="input-field res-field" readonly>
        </div>
    </div>

    <section class="seo-content" id="seo-box"></section>

    <section class="tools-network">
        <h4 id="txt-other-tools">Other Elite Tools</h4>
        <div class="tools-grid">
            <a href="https://smart-converter.github.io/unit-converter/" class="tool-link-btn" id="lnk-unit">Unit Converter</a>
            <a href="https://smart-converter.github.io/currency-converter/" class="tool-link-btn" id="lnk-cur">Currency</a>
            <a href="https://smart-converter.github.io/vat-calculator/" class="tool-link-btn" id="lnk-vat">VAT Calc</a>
            <a href="https://smart-converter.github.io/loan-calculator/" class="tool-link-btn" id="lnk-loan">Loans</a>
            <a href="https://smart-converter.github.io/discount-calculator/" class="tool-link-btn" id="lnk-disc">Discounts</a>
            <a href="https://smart-converter.github.io/tip-calculator/" class="tool-link-btn" id="lnk-tip">Tips</a>
            <a href="https://smart-converter.github.io/bmi-calculator/" class="tool-link-btn" id="lnk-bmi">BMI Calc</a>
        </div>
    </section>
</main>

<footer>
    <div class="footer-info-block" id="footer-full-text"></div>
    <p style="font-size: 11px; margin-bottom: 10px;">© 2026 SmartPercentage.io - Precise Financial Tools</p>
    <div>
        <button class="footer-link" onclick="openPol('privacy')" id="link-privacy">Privacy Policy</button>
        <button class="footer-link" onclick="openPol('terms')" id="link-terms">Terms of Use</button>
    </div>
</footer>

<div id="siteModal" class="modal" onclick="if(event.target == this) closeModal()" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-labelledby="modalTitle">
        <button class="close-btn" onclick="closeModal()" aria-label="Close modal">×</button>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const translations = {
        en: {
            res: "Result:", other: "Other Elite Tools", cats: ["Basic %", "Difference", "Increase"],
            l1: "Percentage %", l2: "Of Number", l3: "Initial Value", l4: "Final Value", l5: "Value",
            unit: "Unit Converter", cur: "Currency", vat: "VAT Calc", loan: "Loans", disc: "Discounts", tip: "Tips", bmi: "BMI Calc",
            footer: "SmartPercentage.io is your go-to destination for high-precision percentage calculations. Whether you are a business professional calculating profit margins or a student working on math problems, our tool provides instant, reliable results. We use advanced algorithms to ensure 100% accuracy for business and students.",
            seo: `<h2>Why Use Our Percentage Calculator?</h2><p>In finance, shopping, and data analysis, percentages are everywhere. SmartPercentage.io simplifies these tasks. Our tool supports three main modes: finding a percentage of a number, calculating the percentage difference between two values, and adding a percentage increase to a base value.</p><h2>Perfect for Business and Daily Life</h2><p>Need to calculate a 15% tip? Or a 20% increase in annual revenue? Our professional interface is optimized for both mobile and desktop, ensuring you get the answers you need in seconds.</p>`,
            privacy: "Privacy Policy", terms: "Terms of Use",
            privText: "<h2 id='modalTitle'>Privacy Policy</h2><p>Your privacy is our priority. SmartPercentage.io does not store any numerical data you enter. All calculations are performed instantly in your browser.</p>",
            termsText: "<h2 id='modalTitle'>Terms of Use</h2><p>Our tools are provided for informational purposes. While we strive for absolute mathematical precision, we recommend verifying critical financial figures with official sources.</p>"
        },
        uk: {
            res: "Результат:", other: "Інші професійні інструменти", cats: ["Базовий %", "Різниця", "Приріст"],
            l1: "Відсоток %", l2: "Від числа", l3: "Початкове", l4: "Кінцеве", l5: "Значення",
            unit: "Конвертер", cur: "Валюти", vat: "ПДВ", loan: "Кредити", disc: "Знижки", tip: "Чайові", bmi: "Індекс маси",
            footer: "SmartPercentage.io — це ваш надійний помічник для високоточних розрахунків відсотків. Незалежно від того, чи ви професійний фінансист, чи студент, наш інструмент забезпечує миттєві та надійні результати. Ми використовуємо сучасні алгоритми, щоб гарантувати 100% точність кожного обчислення.",
            seo: `<h2>Навіщо потрібен наш калькулятор відсотків?</h2><p>У фінансах, покупках та аналізі даних відсотки зустрічаються скрізь. SmartPercentage.io спрощує ці завдання. Наш інструмент підтримує три основні режими: знаходження відсотка від числа, розрахунок відсоткової різниці та приросту.</p><h2>Ідеально для бізнесу та побуту</h2><p>Потрібно порахувати 15% чайових? Або 20% приросту доходу? Наш інтерфейс оптимізований для мобільних пристроїв, щоб ви отримували відповіді за секунди.</p>`,
            privacy: "Конфіденційність", terms: "Умови",
            privText: "<h2 id='modalTitle'>Політика конфіденційності</h2><p>Ваша конфіденційність — наш пріоритет. Ми не зберігаємо ваші дані. Усі розрахунки відбуваються прямо у вашому браузері.</p>",
            termsText: "<h2 id='modalTitle'>Умови використання</h2><p>Інструменти надаються для інформаційних цілей. Ми рекомендуємо перевіряти критичні фінансові дані в офіційних джерелах.</p>"
        },
        es: {
            res: "Resultado:", other: "Otras herramientas", cats: ["Básico %", "Diferencia", "Aumento"],
            l1: "Porcentaje %", l2: "Del número", l3: "Valor inicial", l4: "Valor final", l5: "Valor",
            unit: "Convertidor", cur: "Moneda", vat: "IVA", loan: "Préstamos", disc: "Descuento", tip: "Propina", bmi: "IMC",
            footer: "SmartPercentage.io es su destino preferido para cálculos de porcentaje de alta precisión. Ya sea un profesional de negocios que calcula márgenes de beneficio o un estudiante, nuestra herramienta ofrece resultados instantáneos. Utilizamos algoritmos avanzados para garantizar que cada cálculo sea 100% preciso.",
            seo: `<h2>¿Por qué utilizar nuestra calculadora de porcentajes?</h2><p>En las finanzas, las compras y el análisis de datos, los porcentajes están en todas partes. SmartPercentage.io simplifica estas tareas. Nuestra herramienta admite tres modos: encontrar el porcentaje de un número, calcular la diferencia y añadir aumentos.</p><h2>Perfecto para el uso diario</h2><p>Calcule propinas, descuentos comerciales o crecimientos anuales en segundos con nuestra interfaz optimizada para móviles y escritorio.</p>`,
            privacy: "Privacidad", terms: "Términos",
            privText: "<h2 id='modalTitle'>Política de Privacidad</h2><p>Su privacidad es nuestra prioridad. SmartPercentage.io no almacena ningún dato numérico que ingrese. Todos los cálculos se realizan localmente en su navegador.</p>",
            termsText: "<h2 id='modalTitle'>Términos de Uso</h2><p>Nuestras herramientas se proporcionan solo con fines informativos. Recomendamos verificar los datos financieros críticos con fuentes oficiales.</p>"
        },
        de: {
            res: "Ergebnis:", other: "Andere Werkzeuge", cats: ["Basis %", "Differenz", "Zunahme"],
            l1: "Prozent %", l2: "Von Zahl", l3: "Startwert", l4: "Endwert", l5: "Wert",
            unit: "Konverter", cur: "Währung", vat: "MwSt", loan: "Kredit", disc: "Rabatt", tip: "Trinkgeld", bmi: "BMI",
            footer: "SmartPercentage.io ist Ihre Anlaufstelle für hochpräzise Prozentrechnungen. Ob Sie als Geschäftsmann Gewinnmargen berechnen oder als Student arbeiten, unser Tool liefert sofortige Ergebnisse. Wir verwenden fortschrittliche Algorithmen für 100% mathematische Genauigkeit.",
            seo: `<h2>Warum unseren Prozentrechner nutzen?</h2><p>In Finanzen und Datenanalysen sind Prozentsätze allgegenwärtig. SmartPercentage.io vereinfacht diese Aufgaben. Unser Tool unterstützt die Berechnung von Anteilen, Differenzen und prozentualen Steigerungen.</p><h2>Ideal für Business und Alltag</h2><p>Berechnen Sie Trinkgelder, Rabatte oder Umsatzsteigerungen in Sekunden mit unserem professionellen Interface, das für Mobile und Desktop optimiert ist.</p>`,
            privacy: "Datenschutz", terms: "AGB",
            privText: "<h2 id='modalTitle'>Datenschutzrichtlinie</h2><p>Ihre Privatsphäre ist uns wichtig. SmartPercentage.io speichert keine von Ihnen eingegebenen Daten. Alle Berechnungen erfolgen lokal in Ihrem Browser.</p>",
            termsText: "<h2 id='modalTitle'>Nutzungsbedingungen</h2><p>Unsere Tools dienen nur zu Informationszwecken. Bitte überprüfen Sie wichtige Finanzdaten mit offiziellen Bankdokumenten.</p>"
        }
    };

    let curLang = localStorage.getItem('lang_perc') || 'en';
    let currentTab = 0;

    function changeLang(lang) { curLang = lang; localStorage.setItem('lang_perc', lang); updateUI(); }

    function updateUI() {
        const l = translations[curLang] || translations.en;
        document.getElementById('langSelect').value = curLang;
        document.getElementById('lbl-result').innerText = l.res;
        document.getElementById('txt-other-tools').innerText = l.other;
        document.getElementById('footer-full-text').innerHTML = l.footer;
        document.getElementById('link-privacy').innerText = l.privacy;
        document.getElementById('link-terms').innerText = l.terms;
        document.getElementById('seo-box').innerHTML = l.seo;
        document.getElementById('lnk-unit').innerText = l.unit;
        document.getElementById('lnk-cur').innerText = l.cur;
        document.getElementById('lnk-vat').innerText = l.vat;
        document.getElementById('lnk-loan').innerText = l.loan;
        document.getElementById('lnk-disc').innerText = l.disc;
        document.getElementById('lnk-tip').innerText = l.tip;
        document.getElementById('lnk-bmi').innerText = l.bmi;
        initTabs();
    }

    function initTabs() {
        const t = document.getElementById('tabs'); t.innerHTML = '';
        const l = translations[curLang] || translations.en;
        l.cats.forEach((cat, i) => {
            const btn = document.createElement('button');
            btn.className = `tab ${i === currentTab ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => { currentTab = i; initTabs(); renderCalc(); };
            t.appendChild(btn);
        });
        renderCalc();
    }

    function renderCalc() {
        const l = translations[curLang] || translations.en;
        const container = document.getElementById('calc-ui');
        let html = '';
        if (currentTab === 0) {
            html = `<div class="row"><label for="v1">${l.l1}:</label><input type="number" id="v1" class="input-field" value="10" oninput="calc()"></div>
                    <div class="row"><label for="v2">${l.l2}:</label><input type="number" id="v2" class="input-field" value="100" oninput="calc()"></div>`;
        } else if (currentTab === 1) {
            html = `<div class="row"><label for="v1">${l.l3}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label for="v2">${l.l4}:</label><input type="number" id="v2" class="input-field" value="125" oninput="calc()"></div>`;
        } else {
            html = `<div class="row"><label for="v1">${l.l5}:</label><input type="number" id="v1" class="input-field" value="100" oninput="calc()"></div>
                    <div class="row"><label for="v2">${l.l1} (+):</label><input type="number" id="v2" class="input-field" value="20" oninput="calc()"></div>`;
        }
        container.innerHTML = html;
        calc();
    }

    function calc() {
        const a = parseFloat(document.getElementById('v1').value) || 0;
        const b = parseFloat(document.getElementById('v2').value) || 0;
        const out = document.getElementById('valOut');
        let res = (currentTab === 0) ? a * (b / 100) : (currentTab === 1) ? (a !== 0 ? ((b - a) / a) * 100 : 0) : a + (a * (b / 100));
        out.value = currentTab === 1 ? res.toFixed(2) + "%" : res.toLocaleString(undefined, {maximumFractionDigits: 2});
    }

    function openPol(type) {
        const l = translations[curLang] || translations.en;
        document.getElementById('modalBody').innerHTML = type === 'privacy' ? l.privText : l.termsText;
        document.getElementById('siteModal').style.display = 'block';
        document.getElementById('siteModal').setAttribute('aria-hidden', 'false');
    }
    function closeModal() { 
        document.getElementById('siteModal').style.display = 'none'; 
        document.getElementById('siteModal').setAttribute('aria-hidden', 'true');
    }

    updateUI();
</script>
</body>
</html>
